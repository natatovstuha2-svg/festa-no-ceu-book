<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Свято на небі — інтерактивна книга</title>

<style>
/* =========================================================
   БАЗОВІ НАЛАШТУВАННЯ
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    color: #173c51;
    overflow-x: hidden;

    background:
        radial-gradient(circle at 8% 18%,
            rgba(102, 220, 195, .20),
            transparent 28%),
        radial-gradient(circle at 91% 80%,
            rgba(82, 188, 237, .20),
            transparent 29%),
        linear-gradient(
            135deg,
            #ffffff 0%,
            #edfaff 48%,
            #fbfeff 100%
        );
}


/* =========================================================
   ОБКЛАДИНКА
========================================================= */

#coverScreen {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 24px;

    perspective: 2200px;
}

.closed-book {
    position: relative;

    width: min(92vw, 1450px);
    aspect-ratio: 16 / 9;

    transform-style: preserve-3d;

    filter:
        drop-shadow(0 34px 31px rgba(28, 69, 70, .25));
}

/* паперовий блок під обкладинкою */
.closed-book::before {
    content: "";

    position: absolute;

    z-index: -2;

    left: 3%;
    right: .7%;

    top: 2%;
    bottom: -17px;

    border-radius: 6px 17px 19px 6px;

    background:
        repeating-linear-gradient(
            to bottom,
            #ffffff 0px,
            #ffffff 2px,
            #d2dde0 3px,
            #fdfdfd 5px
        );

    box-shadow:
        6px 12px 20px rgba(26, 57, 59, .18);
}

/* нижня тверда обкладинка */
.closed-book::after {
    content: "";

    position: absolute;

    z-index: -3;

    left: 1%;
    right: -.5%;

    top: .8%;
    bottom: -27px;

    border-radius: 7px 19px 22px 7px;

    background:
        linear-gradient(
            90deg,
            #073e2f,
            #0c654a 37%,
            #073f30
        );

    border: 2px solid rgba(218, 174, 60, .80);

    box-shadow:
        inset 0 0 0 2px rgba(255, 219, 108, .15);
}

.cover-face {
    position: absolute;
    inset: 0;

    border-radius: 6px 18px 18px 6px;

    overflow: hidden;

    transform-origin: left center;

    transition:
        transform 1.05s cubic-bezier(.68,.01,.20,1),
        opacity .65s ease;
}

.cover-face.opening {
    transform:
        rotateY(-104deg)
        translateX(-2%);

    opacity: .08;
}

.cover-face img {
    width: 100%;
    height: 100%;

    display: block;
    object-fit: cover;

    user-select: none;
}

/* кутик відкривання */
.open-corner {
    position: absolute;

    right: 0;
    bottom: 0;

    width: 112px;
    height: 112px;

    z-index: 20;

    border: 0;
    background: transparent;

    cursor: pointer;
}

.open-corner::before {
    content: "";

    position: absolute;
    inset: 0;

    clip-path:
        polygon(100% 0, 100% 100%, 0 100%);

    background:
        linear-gradient(
            135deg,
            transparent 47%,
            rgba(255,255,255,.88) 50%,
            rgba(235,244,244,.98) 100%
        );

    filter:
        drop-shadow(-5px -5px 7px rgba(0,0,0,.11));

    transition:
        transform .23s ease;
}

.open-corner:hover::before {
    transform:
        translate(-5px,-5px);
}


/* =========================================================
   ЕКРАН КНИГИ
========================================================= */

#readerScreen {
    display: none;

    min-height: 100vh;

    flex-direction: column;
    align-items: center;
    justify-content: center;

    padding: 20px 12px 14px;
}

#readerScreen.visible {
    display: flex;
}


/* =========================================================
   ОБ'ЄМНА КНИГА
========================================================= */

.book-shell {
    --left-stack: 5px;
    --right-stack: 25px;

    position: relative;

    width: min(96vw, 1760px);
    aspect-ratio: 16 / 9;

    perspective: 2500px;

    padding:
        11px
        15px
        31px;

    filter:
        drop-shadow(
            0 34px 34px
            rgba(29, 70, 72, .21)
        );
}

/* тверда обкладинка під книгою */
.book-shell::before {
    content: "";

    position: absolute;

    z-index: -5;

    left: 0;
    right: 0;

    top: 8px;
    bottom: 0;

    border-radius:
        20px 20px 25px 25px;

    background:
        linear-gradient(
            90deg,
            #073f30 0%,
            #0b664a 20%,
            #0b4b39 50%,
            #0b664a 80%,
            #073f30 100%
        );

    border:
        2px solid rgba(217, 171, 53, .88);

    box-shadow:
        inset 0 0 0 2px
        rgba(255, 219, 108, .18);
}

/* нижній зріз сторінок */
.book-shell::after {
    content: "";

    position: absolute;

    z-index: -3;

    left: 17px;
    right: 17px;

    bottom: 10px;

    height: 26px;

    border-radius:
        0 0 15px 15px;

    background:
        repeating-linear-gradient(
            to bottom,
            #ffffff 0px,
            #ffffff 2px,
            #d5dfe1 3px,
            #ffffff 5px
        );

    box-shadow:
        0 9px 15px
        rgba(25, 58, 61, .16);
}


/* =========================================================
   ТОВЩИНА ЛІВОГО І ПРАВОГО БЛОКУ
========================================================= */

.page-stack-left,
.page-stack-right {
    position: absolute;

    z-index: -2;

    top: 19px;
    bottom: 35px;

    background:
        repeating-linear-gradient(
            90deg,
            #fdfdfd 0,
            #fdfdfd 2px,
            #d2dcdf 3px,
            #ffffff 5px
        );

    box-shadow:
        0 5px 10px rgba(22, 50, 54, .11);

    transition:
        width .45s ease;
}

.page-stack-left {
    left: 12px;

    width: var(--left-stack);

    border-radius: 13px 0 0 13px;
}

.page-stack-right {
    right: 12px;

    width: var(--right-stack);

    border-radius: 0 13px 13px 0;
}


/* =========================================================
   РОЗВОРОТ
========================================================= */

.spread {
    position: absolute;

    left: 15px;
    right: 15px;

    top: 11px;
    bottom: 31px;

    display: flex;

    background: #ffffff;

    border-radius: 13px;

    overflow: visible;

    transform-style: preserve-3d;

    box-shadow:
        0 4px 13px rgba(34, 65, 68, .10);
}

.page {
    position: relative;

    width: 50%;
    height: 100%;

    overflow: hidden;

    background: #ffffff;
}

.left-page {
    border-radius:
        12px 2px 2px 12px;

    box-shadow:
        inset -18px 0 27px rgba(25, 44, 48, .12);
}

.right-page {
    border-radius:
        2px 12px 12px 2px;

    box-shadow:
        inset 18px 0 27px rgba(25, 44, 48, .11);
}


/* =========================================================
   ГЛИБОКИЙ КНИЖКОВИЙ ЗГИН
========================================================= */

.left-page::after {
    content: "";

    position: absolute;

    z-index: 25;

    right: 0;
    top: 0;
    bottom: 0;

    width: 75px;

    pointer-events: none;

    background:
        linear-gradient(
            to left,
            rgba(12, 29, 33, .26) 0%,
            rgba(20, 38, 42, .17) 20%,
            rgba(33, 55, 59, .08) 48%,
            transparent 100%
        );
}

.right-page::before {
    content: "";

    position: absolute;

    z-index: 25;

    left: 0;
    top: 0;
    bottom: 0;

    width: 75px;

    pointer-events: none;

    background:
        linear-gradient(
            to right,
            rgba(12, 29, 33, .27) 0%,
            rgba(20, 38, 42, .17) 20%,
            rgba(33, 55, 59, .08) 48%,
            transparent 100%
        );
}

.gutter-shadow {
    position: absolute;

    z-index: 65;

    left: 50%;

    top: 0;
    bottom: 0;

    width: 88px;

    transform:
        translateX(-50%);

    pointer-events: none;

    background:
        linear-gradient(
            90deg,
            transparent 0%,
            rgba(17, 32, 36, .05) 12%,
            rgba(13, 27, 30, .19) 34%,
            rgba(5, 16, 18, .40) 48%,
            rgba(255,255,255,.28) 50%,
            rgba(5, 16, 18, .38) 52%,
            rgba(13, 27, 30, .19) 66%,
            rgba(17, 32, 36, .05) 88%,
            transparent 100%
        );

    filter: blur(.15px);
}


/* =========================================================
   СЮЖЕТНІ ІЛЮСТРАЦІЇ
========================================================= */

.scene-page {
    background: #e3f7ff;
}

.scene-page > .scene-image {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;

    user-select: none;
}


/* =========================================================
   ТЕКСТОВА СТОРІНКА
========================================================= */

.text-page,
.task-page,
.quiz-page {
    background:
        url("text-page-bg.png")
        center / cover no-repeat;
}

.text-wrap {
    position: absolute;

    left: 8.5%;
    right: 8.2%;

    top: 8%;
    bottom: 8%;

    display: flex;

    flex-direction: column;

    justify-content: center;

    z-index: 5;
}

.story-text {
    margin: 0;

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    font-size:
        clamp(16px, 1.22vw, 24px);

    line-height: 1.47;

    font-weight: 430;

    color: #183d53;

    text-align: left;
}

.story-text p {
    margin:
        0 0 .72em;
}

.story-text strong {
    color: #075273;
    font-weight: 750;
}

.dialogue {
    color: #075273;
    font-weight: 650;
}


/* =========================================================
   АНІМАЦІЯ ХМАР
========================================================= */

.cloud-layer {
    position: absolute;

    inset: 0;

    z-index: 12;

    overflow: hidden;

    pointer-events: none;
}

.cloud {
    position: absolute;

    height: auto;

    pointer-events: none;
}

.cloud-a {
    width: 64%;

    top: 3%;
    left: -68%;

    opacity: .66;

    animation:
        cloudRight
        16s linear infinite;
}

.cloud-b {
    width: 48%;

    top: 55%;
    left: -57%;

    opacity: .46;

    animation:
        cloudRight
        26s linear infinite;

    animation-delay: -9s;
}

.cloud-layer.reverse .cloud-a {
    left: auto;
    right: -68%;

    animation-name:
        cloudLeft;
}

.cloud-layer.reverse .cloud-b {
    left: auto;
    right: -57%;

    animation-name:
        cloudLeft;
}

@keyframes cloudRight {
    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(275%);
    }
}

@keyframes cloudLeft {
    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(-275%);
    }
}


/* =========================================================
   ПАДІННЯ ДЖАБУТІ
========================================================= */

.falling-scene {
    position: absolute;

    inset: 0;

    overflow: hidden;

    background:
        url("falling-bg.png")
        center / cover no-repeat;
}

.falling-scene .cloud-a {
    animation-duration: 7s;
}

.falling-scene .cloud-b {
    animation-duration: 10s;
}

.falling-jabuti {
    position: absolute;

    z-index: 15;

    left: 50%;
    top: -5%;

    width: 30%;

    transform-origin: center;

    filter:
        drop-shadow(
            0 18px 17px
            rgba(20, 50, 59, .18)
        );

    animation:
        jabutiFall
        4.2s ease-in infinite;
}

@keyframes jabutiFall {

    0% {
        transform:
            translate(-50%, -10%)
            rotate(-15deg)
            scale(.72);
    }

    38% {
        transform:
            translate(-35%, 85%)
            rotate(18deg)
            scale(.82);
    }

    72% {
        transform:
            translate(-60%, 185%)
            rotate(-22deg)
            scale(.96);
    }

    100% {
        transform:
            translate(-42%, 310%)
            rotate(24deg)
            scale(1.13);
    }
}


/* =========================================================
   ДЖАБУТІ В ІНТЕРАКТИВНИХ БЛОКАХ
   ЗАВЖДИ НА ПІДЛОЖЦІ
========================================================= */

.jabuti-panel {
    position: absolute;

    inset: 0;

    overflow: hidden;

    background:
        url("text-page-bg.png")
        center / cover no-repeat;
}

.jabuti-panel::after {
    content: "";

    position: absolute;

    left: 12%;
    right: 12%;

    bottom: 3%;

    height: 16%;

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse,
            rgba(48, 120, 92, .18),
            transparent 68%
        );

    filter: blur(8px);
}

.quiz-jabuti {
    position: absolute;

    z-index: 5;

    width: 52%;

    left: 50%;
    bottom: 3%;

    transform:
        translateX(-50%);

    transform-origin:
        center bottom;

    filter:
        drop-shadow(
            0 18px 15px
            rgba(23, 61, 64, .18)
        );

    animation:
        jabutiIdle
        3s ease-in-out infinite;
}

@keyframes jabutiIdle {

    0%,
    100% {
        transform:
            translateX(-50%)
            translateY(0)
            rotate(-1deg);
    }

    50% {
        transform:
            translateX(-50%)
            translateY(-10px)
            rotate(1.5deg);
    }
}

.quiz-jabuti.celebrate {
    animation:
        celebrate
        .62s ease;
}

@keyframes celebrate {

    0% {
        transform:
            translateX(-50%)
            scale(1);
    }

    32% {
        transform:
            translateX(-50%)
            translateY(-20px)
            rotate(-5deg)
            scale(1.07);
    }

    68% {
        transform:
            translateX(-50%)
            rotate(4deg)
            scale(1.04);
    }

    100% {
        transform:
            translateX(-50%)
            scale(1);
    }
}


/* репліка Джабуті */
.speech-bubble {
    position: absolute;

    z-index: 8;

    top: 10%;
    left: 9%;
    right: 9%;

    padding:
        18px 22px;

    border-radius: 22px;

    background:
        rgba(255,255,255,.91);

    border:
        1px solid rgba(21, 104, 137, .16);

    box-shadow:
        0 9px 25px
        rgba(31, 91, 107, .11);

    color: #075273;

    font-size:
        clamp(16px, 1.2vw, 23px);

    line-height: 1.35;

    font-weight: 700;

    text-align: center;
}


/* =========================================================
   КЛІКАБЕЛЬНІ ПЛАШКИ
========================================================= */

.interactive-wrap {
    position: absolute;

    inset: 7% 7.5%;

    overflow-y: auto;

    z-index: 5;

    padding-right: 5px;
}

.interactive-title {
    margin:
        0 0 17px;

    color: #075273;

    font-size:
        clamp(23px, 1.65vw, 31px);

    line-height: 1.15;

    font-weight: 800;
}

.cards {
    display: grid;

    gap: 10px;
}

.task-card,
.quiz-card {
    width: 100%;

    border:
        1px solid rgba(16, 105, 140, .19);

    border-radius: 18px;

    background:
        rgba(255,255,255,.91);

    color: #17465e;

    box-shadow:
        0 5px 14px
        rgba(34, 93, 107, .09);

    overflow: hidden;

    transition:
        transform .18s ease,
        box-shadow .18s ease,
        border-color .18s ease;
}

.task-card:hover,
.quiz-card:hover {
    transform:
        translateY(-1px);

    box-shadow:
        0 8px 18px
        rgba(34, 93, 107, .13);

    border-color:
        rgba(16, 105, 140, .30);
}

.task-toggle,
.quiz-toggle {
    width: 100%;

    border: 0;

    background: transparent;

    padding:
        13px 16px;

    color: inherit;

    font-family: inherit;

    font-size:
        clamp(14px, .97vw, 18px);

    line-height: 1.35;

    font-weight: 700;

    text-align: left;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 10px;
}

.task-toggle::after,
.quiz-toggle::after {
    content: "+";

    flex: 0 0 auto;

    width: 26px;
    height: 26px;

    display: grid;
    place-items: center;

    border-radius: 50%;

    background:
        rgba(30, 124, 158, .10);

    color: #096184;

    font-size: 20px;

    transition:
        transform .22s ease;
}

.task-card.open .task-toggle::after,
.quiz-card.open .quiz-toggle::after {
    transform: rotate(45deg);
}

.task-detail,
.quiz-options {
    max-height: 0;

    overflow: hidden;

    padding:
        0 16px;

    opacity: 0;

    transition:
        max-height .30s ease,
        opacity .25s ease,
        padding .30s ease;
}

.task-card.open .task-detail,
.quiz-card.open .quiz-options {
    max-height: 260px;

    opacity: 1;

    padding:
        2px 16px 15px;
}

.task-detail {
    color: #214d62;

    font-size:
        clamp(14px, .93vw, 17px);

    line-height: 1.45;
}


/* =========================================================
   ВАРІАНТИ ВІДПОВІДЕЙ
========================================================= */

.answer-row {
    display: flex;
    flex-wrap: wrap;

    gap: 7px;
}

.answer {
    border:
        1px solid rgba(14, 101, 137, .20);

    border-radius: 999px;

    background:
        rgba(255,255,255,.96);

    color: #12546f;

    padding:
        7px 12px;

    cursor: pointer;

    font-size:
        clamp(13px, .85vw, 16px);

    transition:
        .17s ease;
}

.answer:hover {
    transform: translateY(-1px);
}

.answer.correct {
    background: #d9f4df;
    border-color: #63b47a;
    color: #23643a;
}

.answer.wrong {
    background: #ffe3e3;
    border-color: #d87c7c;
    color: #923e3e;

    animation:
        wrongShake
        .26s ease;
}

@keyframes wrongShake {
    0%,
    100% {
        transform: translateX(0);
    }

    35% {
        transform: translateX(-4px);
    }

    70% {
        transform: translateX(4px);
    }
}


/* остання перевірка */
.memory-card {
    margin-top: 11px;

    padding:
        15px 17px;

    border-radius: 18px;

    background:
        rgba(255,255,255,.92);

    border:
        1px solid rgba(16, 105, 140, .18);

    box-shadow:
        0 5px 14px rgba(34,93,107,.09);

    color: #17465e;

    line-height: 1.42;

    font-weight: 650;
}

.memory-button {
    margin-top: 10px;

    border: 0;

    border-radius: 999px;

    padding:
        8px 15px;

    background: #0e698c;

    color: #ffffff;

    font-weight: 700;

    cursor: pointer;
}

.memory-answer {
    display: none;

    margin-top: 12px;

    color: #075273;
}

.memory-answer.visible {
    display: block;

    animation:
        reveal .35s ease;
}

@keyframes reveal {
    from {
        opacity: 0;
        transform: translateY(6px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =========================================================
   СПРАВЖНІЙ ЕФЕКТ ПЕРЕГОРТАННЯ
========================================================= */

.turn-sheet {
    display: none;

    position: absolute;

    z-index: 80;

    left: 50%;

    top: 0;
    bottom: 0;

    width: 50%;

    transform-origin: left center;

    transform-style: preserve-3d;

    pointer-events: none;
}

.turn-sheet.active {
    display: block;
}

.sheet-face {
    position: absolute;

    inset: 0;

    overflow: hidden;

    backface-visibility: hidden;

    background: #ffffff;
}

.sheet-front {
    border-radius:
        2px 12px 12px 2px;

    box-shadow:
        inset 18px 0 27px rgba(25,44,48,.11),
        -3px 0 15px rgba(14,30,33,.18);
}

.sheet-back {
    transform: rotateY(180deg);

    border-radius:
        12px 2px 2px 12px;

    box-shadow:
        inset -18px 0 27px rgba(25,44,48,.12),
        3px 0 15px rgba(14,30,33,.18);
}

/* динамічна тінь аркуша */
.turn-sheet::after {
    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    background:
        linear-gradient(
            to left,
            rgba(0,0,0,.02),
            rgba(0,0,0,.23)
        );

    opacity: .32;

    backface-visibility: hidden;
}


/* =========================================================
   КУТИКИ ГОРТАННЯ
========================================================= */

.page-corner {
    position: absolute;

    z-index: 105;

    bottom: 0;

    width: 79px;
    height: 79px;

    border: 0;

    background: transparent;

    cursor: pointer;

    opacity: .72;

    transition:
        opacity .2s ease,
        transform .2s ease;
}

.page-corner:hover {
    opacity: 1;
    transform: scale(1.05);
}

.page-corner:disabled {
    opacity: 0;
    pointer-events: none;
}

.corner-next {
    right: 0;
}

.corner-prev {
    left: 0;
}

.corner-next::before,
.corner-prev::before {
    content: "";

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            135deg,
            transparent 46%,
            rgba(255,255,255,.74) 49%,
            rgba(219, 183, 73, .29) 100%
        );
}

.corner-next::before {
    clip-path:
        polygon(100% 0,100% 100%,0 100%);
}

.corner-prev::before {
    transform: scaleX(-1);

    clip-path:
        polygon(100% 0,100% 100%,0 100%);
}


/* =========================================================
   КЕРУВАННЯ
========================================================= */

.reader-controls {
    width: min(94vw, 1720px);

    display: grid;

    grid-template-columns:
        1fr auto 1fr;

    align-items: center;

    margin-top: 15px;
}

.control-left {
    justify-self: start;
}

.control-right {
    justify-self: end;
}

.round-button {
    width: 46px;
    height: 46px;

    display: grid;
    place-items: center;

    border-radius: 50%;

    border:
        1px solid rgba(24, 102, 130, .15);

    background:
        rgba(255,255,255,.94);

    color: #155f7c;

    cursor: pointer;

    box-shadow:
        0 7px 18px rgba(34,89,101,.12);

    transition:
        transform .18s ease;
}

.round-button:hover {
    transform: scale(1.06);
}

.round-button svg {
    width: 22px;
    height: 22px;

    fill: none;
    stroke: currentColor;

    stroke-width: 2.1;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.counter {
    min-width: 150px;

    padding:
        8px 16px;

    border-radius: 999px;

    text-align: center;

    background:
        rgba(255,255,255,.91);

    border:
        1px solid rgba(24,102,130,.13);

    color: #17617d;

    font-weight: 700;

    font-size: 14px;

    box-shadow:
        0 6px 15px rgba(32,91,104,.09);
}

.flip-hint {
    margin-top: 9px;

    color: #6090a1;

    font-size: 13px;

    text-align: center;
}


/* =========================================================
   МОБІЛЬНА ВЕРСІЯ
========================================================= */

@media (max-width: 780px) {

    #readerScreen {
        padding:
            5px 2px 12px;
    }

    .book-shell {
        width: 99vw;

        padding:
            5px 6px 17px;
    }

    .spread {
        left: 6px;
        right: 6px;

        top: 5px;
        bottom: 17px;
    }

    .book-shell::after,
    .page-stack-left,
    .page-stack-right {
        opacity: .68;
    }

    .story-text {
        font-size:
            clamp(12px, 2.6vw, 17px);

        line-height: 1.37;
    }

    .text-wrap {
        left: 7%;
        right: 7%;

        top: 6%;
        bottom: 6%;
    }

    .gutter-shadow {
        width: 49px;
    }

    .left-page::after,
    .right-page::before {
        width: 43px;
    }

    .speech-bubble {
        font-size: 13px;
        padding: 10px 12px;
    }

    .quiz-jabuti {
        width: 47%;
    }

    .page-corner {
        width: 54px;
        height: 54px;
    }

    .flip-hint {
        display: none;
    }

}


/* =========================================================
   ДОСТУПНІСТЬ
========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration:
            .01ms !important;

        animation-iteration-count:
            1 !important;

        transition-duration:
            .01ms !important;
    }

}

/* =========================================================

{

},


/* =========================================================
   ПЕРЕВІРКА УВАЖНОСТІ

{
    left: {

            "— Стривай! А ти точно уважно читав мою історію? Перевірмо!"

/* =========================================================
   DOM
========================================================= */

const coverScreen =
    document.getElementById("coverScreen");

const coverFace =
    document.getElementById("coverFace");

const readerScreen =
    document.getElementById("readerScreen");

const leftPage =
    document.getElementById("leftPage");

const rightPage =
    document.getElementById("rightPage");

const turnSheet =
    document.getElementById("turnSheet");

const sheetFront =
    document.getElementById("sheetFront");

const sheetBack =
    document.getElementById("sheetBack");

const nextCorner =
    document.getElementById("nextCorner");

const prevCorner =
    document.getElementById("prevCorner");

const counter =
    document.getElementById("counter");

const bookShell =
    document.getElementById("bookShell");


let currentSpread = 0;
let turning = false;


/* =========================================================
   РЕНДЕР СТОРІНКИ
========================================================= */

function buildPage(spec) {

    if (spec.kind === "image") {

        return {
            className: "scene-page",

            html: `
                <img
                    class="scene-image"
                    src="${spec.src}"
                    alt=""
                    draggable="false"
                >
            `
        };

    }


    if (spec.kind === "flight") {

        return {
            className: "scene-page",

            html: `
                <img
                    class="scene-image"
                    src="${spec.src}"
                    alt=""
                    draggable="false"
                >

                <div class="cloud-layer">

                    <img
                        class="cloud cloud-a"
                        src="clouds-01.png"
                        alt=""
                    >

                    <img
                        class="cloud cloud-b"
                        src="clouds-02.png"
                        alt=""
                    >

                </div>
            `
        };

    }


    if (spec.kind === "return-flight") {

        return {
            className: "scene-page",

            html: `
                <img
                    class="scene-image"
                    src="${spec.src}"
                    alt=""
                    draggable="false"
                >

                <div class="cloud-layer reverse">

                    <img
                        class="cloud cloud-a"
                        src="clouds-01.png"
                        alt=""
                    >

                    <img
                        class="cloud cloud-b"
                        src="clouds-02.png"
                        alt=""
                    >

                </div>
            `
        };

    }


    if (spec.kind === "falling") {

        return {
            className: "scene-page",

            html: `
                <div class="falling-scene">

                    <div class="cloud-layer">

                        <img
                            class="cloud cloud-a"
                            src="clouds-01.png"
                            alt=""
                        >

                        <img
                            class="cloud cloud-b"
                            src="clouds-02.png"
                            alt=""
                        >

                    </div>

                    <img
                        class="falling-jabuti"
                        src="jabuti.png"
                        alt="Джабуті"
                    >

                </div>
            `
        };

    }


    if (spec.kind === "text") {

        return {
            className: "text-page",

            html: `
                <div class="text-wrap">

                    <div class="story-text">
                        ${spec.html}
                    </div>

                </div>
            `
        };

    }


    if (spec.kind === "jabuti-panel") {

        return {
            className: "scene-page",

            html: `
                <div class="jabuti-panel">

                    <div class="speech-bubble">
                        ${spec.bubble}
                    </div>

                    <img
                        class="quiz-jabuti"
                        src="jabuti.png"
                        alt="Джабуті"
                    >

                </div>
            `
        };

    }


    if (spec.kind === "tasks") {

        return {
            className: "task-page",

            html: `
                <div class="interactive-wrap">

                    <h2 class="interactive-title">
                        Поміркуй після читання
                    </h2>


                    <div class="cards">


                        <div class="task-card">

                            <button class="task-toggle">
                                1. Чому Джабуті так хотів
                                потрапити на свято?
                            </button>

                            <div class="task-detail">
                                Чому Джабуті так хотів
                                потрапити на свято,
                                хоча не мав крил?
                            </div>

                        </div>


                        <div class="task-card">

                            <button class="task-toggle">
                                2. Який план він придумав?
                            </button>

                            <div class="task-detail">
                                Який план він придумав?
                                Чому цей план був ризикованим?
                            </div>

                        </div>


                        <div class="task-card">

                            <button class="task-toggle">
                                3. Яким був Джабуті?
                            </button>

                            <div class="task-detail">
                                Як ти вважаєш:
                                Джабуті був сміливим,
                                хитрим чи необачним?
                                Можна обрати кілька відповідей
                                і коротко пояснити.
                            </div>

                        </div>


                        <div class="task-card">

                            <button class="task-toggle">
                                4. До чого призвела його витівка?
                            </button>

                            <div class="task-detail">
                                Що стало наслідком
                                його витівки?
                            </div>

                        </div>


                        <div class="task-card">

                            <button class="task-toggle">
                                5. Чи повірив ти Джабуті?
                            </button>

                            <div class="task-detail">
                                Чи повірив ти Джабуті,
                                коли він під час падіння
                                обіцяв більше нічого
                                не вигадувати?
                                Чому?
                            </div>

                        </div>


                    </div>

                </div>
            `
        };

    }


    if (spec.kind === "quiz") {

        return {
            className: "quiz-page",

            html: `
                <div class="interactive-wrap">

                    <h2 class="interactive-title">
                        Джабуті перевіряє твою уважність
                    </h2>


                    <div class="cards">


                        ${quizCard(
                            "1. Хто повідомляв мешканців лісу про свято?",
                            ["Урубу", "Тукан", "Мавпа"],
                            "Тукан"
                        )}


                        ${quizCard(
                            "2. Де мало відбутися свято?",
                            ["У джунглях", "На небі", "Біля річки"],
                            "На небі"
                        )}


                        ${quizCard(
                            "3. Що Урубу взяв із собою на свято?",
                            ["Барабан", "Гітару", "Кошик із фруктами"],
                            "Гітару"
                        )}


                        ${quizCard(
                            "4. Де сховався Джабуті?",
                            ["У дуплі", "У гітарі", "Під крилом Урубу"],
                            "У гітарі"
                        )}


                        ${quizCard(
                            "5. Що видало Джабуті дорогою назад?",
                            ["Він заспівав", "Він заворушився", "Він засміявся"],
                            "Він заворушився"
                        )}


                    </div>


                    <div class="memory-card">

                        <div>
                            — І найскладніше!
                            Що я обіцяв,
                            коли падав?
                        </div>

                        <button
                            class="memory-button"
                            data-memory
                        >
                            Перевірити
                        </button>

                        <div class="memory-answer">

                            — «Якщо врятуюся —
                            більше ніколи нічого
                            такого не вигадуватиму!»

                            <br><br>

                            Е-е-е…
                            Ну, з обіцянками
                            в мене іноді складно. 😄

                            <br>

                            <strong>
                                До наступної пригоди, друже!
                            </strong>

                        </div>

                    </div>

                </div>
            `
        };

    }


    return {
        className: "",
        html: ""
    };

}


/* =========================================================
   QUIZ CARD
========================================================= */

function quizCard(
    question,
    answers,
    correct
) {

    return `
        <div
            class="quiz-card"
            data-correct="${correct}"
        >

            <button class="quiz-toggle">
                ${question}
            </button>

            <div class="quiz-options">

                <div class="answer-row">

                    ${answers.map(
                        answer => `
                            <button
                                class="answer"
                                data-answer="${answer}"
                            >
                                ${answer}
                            </button>
                        `
                    ).join("")}

                </div>

            </div>

        </div>
    `;

}


/* =========================================================
   APPLY PAGE
========================================================= */

function applyPage(
    element,
    spec,
    side
) {

    const built =
        buildPage(spec);

    element.className =
        `page ${side}-page ${built.className}`;

    element.innerHTML =
        built.html;

}


/* =========================================================
   APPLY SHEET FACE
========================================================= */

function applySheetFace(
    element,
    spec,
    side
) {

    const built =
        buildPage(spec);

    element.className =
        `sheet-face ${built.className} ${
            side === "front"
            ? "sheet-front"
            : "sheet-back"
        }`;

    element.innerHTML =
        built.html;

}


/* =========================================================
   РЕНДЕР РОЗВОРОТУ
========================================================= */

function renderSpread() {

    const spread =
        spreads[currentSpread];

    applyPage(
        leftPage,
        spread.left,
        "left"
    );

    applyPage(
        rightPage,
        spread.right,
        "right"
    );

    updateCounter();
    updateCorners();
    updatePageThickness();

    requestAnimationFrame(
        fitCurrentText
    );

    wireInteractions();

}


/* =========================================================
   ПЕРЕГОРТАННЯ ВПЕРЕД
========================================================= */

function nextSpread() {

    if (
        turning ||
        currentSpread >= spreads.length - 1
    ) {
        return;
    }

    turning = true;


    const current =
        spreads[currentSpread];

    const next =
        spreads[currentSpread + 1];


    applySheetFace(
        sheetFront,
        current.right,
        "front"
    );

    applySheetFace(
        sheetBack,
        next.left,
        "back"
    );


    applyPage(
        rightPage,
        next.right,
        "right"
    );


    turnSheet.classList.add(
        "active"
    );

    turnSheet.style.transition =
        "none";

    turnSheet.style.transform =
        "rotateY(0deg)";


    requestAnimationFrame(
        () => {

            requestAnimationFrame(
                () => {

                    turnSheet.style.transition =
                        "transform 930ms cubic-bezier(.64,.01,.24,1)";

                    turnSheet.style.transform =
                        "rotateY(-180deg)";

                }
            );

        }
    );


    setTimeout(
        () => {

            currentSpread++;

            turnSheet.classList.remove(
                "active"
            );

            turnSheet.style.transition =
                "none";

            turnSheet.style.transform =
                "rotateY(0deg)";

            renderSpread();

            turning = false;

        },
        950
    );

}


/* =========================================================
   ПЕРЕГОРТАННЯ НАЗАД
========================================================= */

function previousSpread() {

    if (
        turning ||
        currentSpread <= 0
    ) {
        return;
    }

    turning = true;


    const current =
        spreads[currentSpread];

    const previous =
        spreads[currentSpread - 1];


    applyPage(
        leftPage,
        previous.left,
        "left"
    );


    applySheetFace(
        sheetFront,
        previous.right,
        "front"
    );

    applySheetFace(
        sheetBack,
        current.left,
        "back"
    );


    turnSheet.classList.add(
        "active"
    );

    turnSheet.style.transition =
        "none";

    turnSheet.style.transform =
        "rotateY(-180deg)";


    requestAnimationFrame(
        () => {

            requestAnimationFrame(
                () => {

                    turnSheet.style.transition =
                        "transform 930ms cubic-bezier(.64,.01,.24,1)";

                    turnSheet.style.transform =
                        "rotateY(0deg)";

                }
            );

        }
    );


    setTimeout(
        () => {

            currentSpread--;

            turnSheet.classList.remove(
                "active"
            );

            renderSpread();

            turning = false;

        },
        950
    );

}


/* =========================================================
   ЛІЧИЛЬНИК
========================================================= */

const STORY_SPREADS = 17;


function updateCounter() {

    if (
        currentSpread < STORY_SPREADS
    ) {

        counter.textContent =
            `${currentSpread + 1} / ${STORY_SPREADS}`;

        return;
    }


    if (
        currentSpread === STORY_SPREADS
    ) {

        counter.textContent =
            "Після читання";

        return;
    }


    counter.textContent =
        "Перевірка уважності";

}


/* =========================================================
   КУТИКИ
========================================================= */

function updateCorners() {

    prevCorner.disabled =
        currentSpread === 0;

    nextCorner.disabled =
        currentSpread === spreads.length - 1;

}


/* =========================================================
   ТОВЩИНА СТОРІНОК
========================================================= */

function updatePageThickness() {

    const max =
        spreads.length - 1;

    const progress =
        currentSpread / max;


    const leftThickness =
        5 + progress * 22;

    const rightThickness =
        27 - progress * 22;


    bookShell.style.setProperty(
        "--left-stack",
        `${leftThickness}px`
    );

    bookShell.style.setProperty(
        "--right-stack",
        `${rightThickness}px`
    );

}


/* =========================================================
   ПІДГАНЯННЯ ТЕКСТУ
========================================================= */

function fitCurrentText() {

    const text =
        rightPage.querySelector(
            ".story-text"
        );

    if (!text) {
        return;
    }


    const holder =
        text.parentElement;

    let size = 24;


    if (
        window.innerWidth < 800
    ) {
        size = 17;
    }


    text.style.fontSize =
        size + "px";


    while (
        text.scrollHeight >
        holder.clientHeight
        &&
        size > 13
    ) {

        size -= .5;

        text.style.fontSize =
            size + "px";

    }

}


/* =========================================================
   КЛІКАБЕЛЬНІ ПЛАШКИ
========================================================= */

function wireInteractions() {

    rightPage
        .querySelectorAll(
            ".task-toggle"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        button
                            .closest(
                                ".task-card"
                            )
                            .classList
                            .toggle(
                                "open"
                            );

                    }
                );

            }
        );


    rightPage
        .querySelectorAll(
            ".quiz-toggle"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        button
                            .closest(
                                ".quiz-card"
                            )
                            .classList
                            .toggle(
                                "open"
                            );

                    }
                );

            }
        );


    rightPage
        .querySelectorAll(
            ".answer"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    event => {

                        event.stopPropagation();


                        const card =
                            button.closest(
                                ".quiz-card"
                            );


                        if (
                            card.dataset.done
                            === "true"
                        ) {
                            return;
                        }


                        const correct =
                            card.dataset.correct;

                        const selected =
                            button.dataset.answer;


                        if (
                            selected === correct
                        ) {

                            button.classList.add(
                                "correct"
                            );

                            card.dataset.done =
                                "true";

                            celebrateJabuti();

                        }

                        else {

                            button.classList.add(
                                "wrong"
                            );


                            setTimeout(
                                () => {

                                    button.classList.remove(
                                        "wrong"
                                    );

                                },
                                700
                            );

                        }

                    }
                );

            }
        );


    const memoryButton =
        rightPage.querySelector(
            "[data-memory]"
        );


    if (memoryButton) {

        memoryButton.addEventListener(
            "click",
            () => {

                const answer =
                    rightPage.querySelector(
                        ".memory-answer"
                    );

                answer.classList.add(
                    "visible"
                );

                celebrateJabuti();

            }
        );

    }

}


/* =========================================================
   РЕАКЦІЯ ДЖАБУТІ
========================================================= */

function celebrateJabuti() {

    const jabuti =
        leftPage.querySelector(
            ".quiz-jabuti"
        );

    if (!jabuti) {
        return;
    }


    jabuti.classList.remove(
        "celebrate"
    );


    void jabuti.offsetWidth;


    jabuti.classList.add(
        "celebrate"
    );

}


/* =========================================================
   ВІДКРИТТЯ КНИГИ
========================================================= */

document
    .getElementById(
        "openBookButton"
    )
    .addEventListener(
        "click",
        () => {

            coverFace.classList.add(
                "opening"
            );


            setTimeout(
                () => {

                    coverScreen.style.display =
                        "none";

                    readerScreen.classList.add(
                        "visible"
                    );

                    renderSpread();

                },
                780
            );

        }
    );


/* =========================================================
   КУТИКИ
========================================================= */

nextCorner.addEventListener(
    "click",
    nextSpread
);

prevCorner.addEventListener(
    "click",
    previousSpread
);


/* =========================================================
   КЛАВІАТУРА
========================================================= */

window.addEventListener(
    "keydown",
    event => {

        if (
            !readerScreen.classList.contains(
                "visible"
            )
        ) {
            return;
        }


        if (
            event.key === "ArrowRight"
        ) {
            nextSpread();
        }


        if (
            event.key === "ArrowLeft"
        ) {
            previousSpread();
        }

    }
);


/* =========================================================
   HOME
========================================================= */

document
    .getElementById(
        "homeButton"
    )
    .addEventListener(
        "click",
        () => {

            readerScreen.classList.remove(
                "visible"
            );

            coverScreen.style.display =
                "flex";

            coverFace.classList.remove(
                "opening"
            );

            currentSpread = 0;

            renderSpread();

        }
    );


/* =========================================================
   FULLSCREEN
========================================================= */

document
    .getElementById(
        "fullscreenButton"
    )
    .addEventListener(
        "click",
        async () => {

            try {

                if (
                    !document.fullscreenElement
                ) {

                    await document
                        .documentElement
                        .requestFullscreen();

                }

                else {

                    await document
                        .exitFullscreen();

                }

            }

            catch (error) {

                console.log(error);

            }

        }
    );


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        requestAnimationFrame(
            fitCurrentText
        );

    }
);

</script>
