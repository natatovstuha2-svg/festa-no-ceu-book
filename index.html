<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Свято на небі — інтерактивна книга</title>

<!-- М'яке книжкове перегортання -->
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

<style>
:root{
  --ink:#183e53;
  --deep:#075676;
  --gold:#d5a52d;
  --green:#0a5a42;
  --text-bg:none;
  --fall-bg:none;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%}
body{
  overflow:hidden;
  font-family:"Segoe UI",Arial,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 7% 14%,rgba(99,221,198,.17),transparent 28%),
    radial-gradient(circle at 93% 84%,rgba(86,193,240,.18),transparent 27%),
    linear-gradient(135deg,#fff 0%,#eefaff 52%,#fbfeff 100%);
}
button{font:inherit}

/* ========================= LOADER ========================= */
#loader{
  position:fixed;inset:0;z-index:3000;
  display:grid;place-items:center;
  background:linear-gradient(135deg,#fff,#eefaff);
  color:#17617d;font-weight:800;font-size:18px;
}
#loader.hidden{display:none}

/* ========================= COVER ========================= */
#coverScreen{
  position:fixed;inset:0;z-index:1000;
  display:flex;align-items:center;justify-content:center;
  padding:18px;
  perspective:2400px;
}
.closed-book{
  position:relative;
  width:min(92vw,calc((100dvh - 42px)*16/9),1450px);
  aspect-ratio:16/9;
  transform-style:preserve-3d;
  filter:drop-shadow(0 32px 29px rgba(29,68,69,.25));
}
.closed-book::before{
  content:"";position:absolute;z-index:-2;
  left:2.8%;right:.6%;top:2%;bottom:-17px;
  border-radius:6px 17px 18px 6px;
  background:repeating-linear-gradient(to bottom,#fff 0 2px,#d6dfe2 3px,#fff 5px);
  box-shadow:5px 11px 18px rgba(30,57,60,.17);
}
.closed-book::after{
  content:"";position:absolute;z-index:-3;
  left:.9%;right:-.5%;top:.8%;bottom:-26px;
  border-radius:7px 19px 21px 7px;
  background:linear-gradient(90deg,#063b2d,#0c674b 36%,#073e30);
  border:2px solid rgba(220,175,57,.84);
}
.cover-face{
  position:absolute;inset:0;overflow:hidden;
  border-radius:6px 18px 18px 6px;
  transform-origin:left center;
  transform-style:preserve-3d;
  transition:transform 1.05s cubic-bezier(.2,.74,.18,1),opacity .76s ease;
}
.cover-face.opening{transform:rotateY(-106deg) translateX(-2%);opacity:.05}
.cover-face img{width:100%;height:100%;display:block;object-fit:cover}
.open-corner{
  position:absolute;right:0;bottom:0;z-index:20;
  width:108px;height:108px;border:0;background:transparent;cursor:pointer;
}
.open-corner::before{
  content:"";position:absolute;inset:0;
  clip-path:polygon(100% 0,100% 100%,0 100%);
  background:linear-gradient(135deg,transparent 47%,rgba(255,255,255,.82) 50%,rgba(233,243,244,.98) 100%);
  filter:drop-shadow(-4px -4px 7px rgba(0,0,0,.12));
  transition:transform .22s ease;
}
.open-corner:hover::before{transform:translate(-5px,-5px)}

/* ========================= READER ========================= */
#readerScreen{
  position:fixed;inset:0;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:8px 10px 10px;
}
#readerScreen.visible{display:flex}
.reader-stage{
  position:relative;
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
}

/* ========================= DESKTOP BOOK ========================= */
#desktopShell{
  position:relative;
  display:block;
  width:min(96vw,calc((100dvh - 104px)*16/9),1760px);
  aspect-ratio:16/9;
  perspective:2600px;
  filter:drop-shadow(0 28px 30px rgba(30,68,70,.20));
}
#desktopShell::before{
  content:"";position:absolute;z-index:-5;
  left:-7px;right:-7px;top:5px;bottom:-20px;
  border-radius:20px 20px 25px 25px;
  background:linear-gradient(90deg,#063a2c 0%,#0b6348 19%,#074433 50%,#0b6348 81%,#063a2c 100%);
  border:2px solid rgba(219,174,57,.88);
  box-shadow:inset 0 0 0 2px rgba(255,217,98,.14);
}
#desktopShell::after{
  content:"";position:absolute;z-index:-4;
  left:10px;right:10px;bottom:-11px;height:25px;
  border-radius:0 0 14px 14px;
  background:repeating-linear-gradient(to bottom,#fff 0 2px,#d6dfe1 3px,#fff 5px);
  box-shadow:0 8px 13px rgba(26,57,60,.14);
}
#book{position:absolute;inset:0;width:100%;height:100%}

/* PageFlip receives individual pages */
.page{
  position:relative;
  overflow:hidden;
  background:#fff;
}
.page-left{box-shadow:inset -18px 0 28px rgba(13,30,34,.12)}
.page-right{box-shadow:inset 18px 0 28px rgba(13,30,34,.11)}

.book-gutter{
  position:absolute;z-index:80;pointer-events:none;
  left:50%;top:0;bottom:0;width:60px;
  transform:translateX(-50%);
  background:linear-gradient(90deg,
    transparent 0%,
    rgba(10,24,27,.05) 18%,
    rgba(5,15,17,.23) 37%,
    rgba(0,7,8,.48) 48%,
    rgba(255,255,255,.18) 50%,
    rgba(0,7,8,.46) 52%,
    rgba(5,15,17,.21) 63%,
    rgba(10,24,27,.05) 82%,
    transparent 100%);
  filter:blur(.25px);
}

/* ========================= STORY IMAGE ========================= */
.scene-page{background:#dceff6}
.scene{
  position:absolute;inset:0;
  width:100%;height:100%;
  display:block;
  object-fit:cover;
  user-select:none;
}
.pos-left{object-position:30% center}
.pos-midleft{object-position:40% center}
.pos-center{object-position:50% center}
.pos-midright{object-position:62% center}
.pos-right{object-position:72% center}

/* ========================= TEXT ========================= */
.text-page,.task-page,.quiz-page,.jabuti-page{
  background:var(--text-bg) center/cover no-repeat;
}
.text-wrap{
  position:absolute;z-index:5;
  left:8.2%;right:8.2%;top:7.5%;bottom:7.5%;
  display:flex;flex-direction:column;justify-content:center;
}
.story-text{
  color:var(--ink);
  line-height:1.43;
  font-weight:430;
}
.story-text p{margin:0 0 .62em}
.story-text strong,.dialogue{color:var(--deep);font-weight:760}

/* ========================= CLOUDS ========================= */
.cloud-layer{position:absolute;inset:0;z-index:10;overflow:hidden;pointer-events:none}
.cloud{position:absolute;height:auto;pointer-events:none}
.cloud-a{width:62%;top:7%;left:-66%;opacity:.53;animation:cloudRight 18s linear infinite}
.cloud-b{width:46%;top:57%;left:-56%;opacity:.38;animation:cloudRight 28s linear infinite;animation-delay:-10s}
.cloud-layer.reverse .cloud-a{left:auto;right:-66%;animation-name:cloudLeft}
.cloud-layer.reverse .cloud-b{left:auto;right:-56%;animation-name:cloudLeft}
@keyframes cloudRight{from{transform:translateX(0)}to{transform:translateX(280%)}}
@keyframes cloudLeft{from{transform:translateX(0)}to{transform:translateX(-280%)}}

/* ========================= FALL ========================= */
.falling-scene{
  position:absolute;inset:0;overflow:hidden;
  background:var(--fall-bg) center/cover no-repeat;
}
.falling-jabuti{
  position:absolute;z-index:15;
  left:50%;top:-7%;width:28%;
  transform-origin:center;
  filter:drop-shadow(0 14px 16px rgba(14,47,54,.17));
  animation:jabutiFall 4.7s cubic-bezier(.38,.04,.74,.72) infinite;
}
@keyframes jabutiFall{
  0%{transform:translate(-50%,-10%) rotate(-12deg) scale(.68)}
  34%{transform:translate(-36%,80%) rotate(15deg) scale(.80)}
  66%{transform:translate(-59%,182%) rotate(-18deg) scale(.94)}
  100%{transform:translate(-42%,315%) rotate(23deg) scale(1.11)}
}

/* ========================= JABUTI FINAL STAGE ========================= */
.jabuti-stage{
  position:absolute;inset:0;overflow:hidden;
  background:
    radial-gradient(circle at 50% 70%,rgba(255,255,255,.78),transparent 34%),
    var(--text-bg) center/cover no-repeat;
}
.jabuti-ground{
  position:absolute;z-index:3;
  left:15%;right:15%;bottom:7%;
  height:18%;
  border-radius:52% 48% 42% 45%/65% 65% 35% 35%;
  background:
    radial-gradient(circle at 25% 12%,rgba(255,255,255,.35),transparent 14%),
    linear-gradient(180deg,#8bd267 0 18%,#5a833f 19% 26%,#9a7a54 27%,#72543b 100%);
  box-shadow:
    inset 0 7px 0 rgba(255,255,255,.16),
    0 14px 24px rgba(41,69,54,.25);
  transform:perspective(380px) rotateX(56deg);
}
.jabuti-ground::before,.jabuti-ground::after{
  content:"";position:absolute;border-radius:50%;background:#58a947
}
.jabuti-ground::before{width:20%;height:22%;left:9%;top:-9%}
.jabuti-ground::after{width:24%;height:20%;right:10%;top:-7%}
.quiz-jabuti{
  position:absolute;z-index:5;
  left:50%;bottom:10%;width:47%;
  transform:translateX(-50%);
  filter:drop-shadow(0 17px 15px rgba(26,58,56,.23));
  transform-origin:center bottom;
  animation:jabutiIdle 3.2s ease-in-out infinite;
}
@keyframes jabutiIdle{
  0%,100%{transform:translateX(-50%) translateY(0) rotate(-1deg)}
  50%{transform:translateX(-50%) translateY(-8px) rotate(1.2deg)}
}
.quiz-jabuti.celebrate{animation:celebrate .62s ease}
@keyframes celebrate{
  0%{transform:translateX(-50%) scale(1)}
  34%{transform:translateX(-50%) translateY(-17px) rotate(-4deg) scale(1.06)}
  70%{transform:translateX(-50%) rotate(4deg) scale(1.04)}
  100%{transform:translateX(-50%) scale(1)}
}
.speech-bubble{
  position:absolute;z-index:8;
  top:7.5%;left:8.5%;right:8.5%;
  padding:15px 19px;
  border-radius:22px;
  background:linear-gradient(180deg,#fff 0%,#f3fbff 100%);
  border:2px solid rgba(255,255,255,.95);
  box-shadow:
    0 7px 0 rgba(103,178,211,.24),
    0 15px 24px rgba(30,88,103,.14),
    inset 0 1px 0 #fff;
  color:var(--deep);
  text-align:center;
  font-size:22px;
  line-height:1.34;
  font-weight:800;
}

/* ========================= BRIGHT 3D PLAQUES ========================= */
.interactive-wrap{
  position:absolute;z-index:5;
  inset:6.5% 7%;
  overflow-y:auto;
  padding:0 7px 15px 2px;
  scrollbar-width:thin;
}
.interactive-title{
  margin:0 0 18px;
  color:var(--deep);
  font-size:30px;
  line-height:1.12;
  font-weight:880;
  text-shadow:0 2px 0 rgba(255,255,255,.85);
}
.cards{display:grid;gap:13px}
.task-card,.quiz-card{
  --accent:#ff9f2e;
  --edge:#d97706;
  position:relative;
  border:2px solid var(--accent);
  border-radius:18px;
  background:linear-gradient(180deg,#fff 0%,#f8fcff 100%);
  box-shadow:
    0 7px 0 var(--edge),
    0 13px 18px rgba(34,89,102,.16),
    inset 0 2px 0 #fff;
  overflow:hidden;
  transition:transform .18s ease,box-shadow .18s ease;
}
.task-card:nth-child(5n+1),.quiz-card:nth-child(5n+1){--accent:#ff9f2e;--edge:#d97706}
.task-card:nth-child(5n+2),.quiz-card:nth-child(5n+2){--accent:#42b8ff;--edge:#1678b5}
.task-card:nth-child(5n+3),.quiz-card:nth-child(5n+3){--accent:#7ed957;--edge:#4c9f32}
.task-card:nth-child(5n+4),.quiz-card:nth-child(5n+4){--accent:#ff68a8;--edge:#c73c78}
.task-card:nth-child(5n+5),.quiz-card:nth-child(5n+5){--accent:#ffd84b;--edge:#d49c12}
.task-card:hover,.quiz-card:hover{
  transform:translateY(-2px);
  box-shadow:0 9px 0 var(--edge),0 15px 20px rgba(34,89,102,.18),inset 0 2px 0 #fff;
}
.task-toggle,.quiz-toggle{
  position:relative;width:100%;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  border:0;background:transparent;
  padding:14px 15px 13px 17px;
  color:#17465d;
  font-size:18px;line-height:1.32;font-weight:820;text-align:left;cursor:pointer;
}
.task-toggle::before,.quiz-toggle::before{
  content:"";position:absolute;left:0;right:0;top:0;height:42%;
  background:linear-gradient(180deg,rgba(255,255,255,.60),transparent);
  pointer-events:none;
}
.task-toggle::after,.quiz-toggle::after{
  content:"+";
  flex:0 0 auto;
  width:32px;height:32px;
  display:grid;place-items:center;
  border-radius:50%;
  background:linear-gradient(180deg,var(--accent),var(--edge));
  color:#fff;font-size:24px;font-weight:900;
  box-shadow:0 4px 0 rgba(0,0,0,.16),0 7px 10px rgba(0,0,0,.12),inset 0 2px 0 rgba(255,255,255,.42);
  transition:transform .22s ease;
}
.task-card.open .task-toggle::after,.quiz-card.open .quiz-toggle::after{transform:rotate(45deg)}
.task-detail,.quiz-options{
  max-height:0;overflow:hidden;opacity:0;padding:0 17px;
  color:#285268;font-size:17px;line-height:1.42;
  transition:max-height .30s ease,opacity .24s ease,padding .28s ease;
}
.task-card.open .task-detail,.quiz-card.open .quiz-options{
  max-height:250px;opacity:1;padding:1px 17px 15px;
}
.answer-row{display:flex;flex-wrap:wrap;gap:8px}
.answer{
  border:2px solid var(--accent);
  border-radius:999px;
  background:#fff;color:#154e67;
  padding:8px 13px;
  font-size:16px;font-weight:760;
  cursor:pointer;
  box-shadow:0 4px 0 rgba(0,0,0,.11);
  transition:.16s ease;
}
.answer.correct{background:#dff4e3;border-color:#5ab473;color:#236239}
.answer.wrong{background:#ffe4e4;border-color:#d36e6e;color:#903d3d;animation:wrongShake .28s ease}
@keyframes wrongShake{0%,100%{transform:translateX(0)}35%{transform:translateX(-4px)}70%{transform:translateX(4px)}}
.memory-card{
  margin-top:15px;
  padding:15px 17px;
  border-radius:18px;
  background:linear-gradient(180deg,#fff,#f7fbff);
  border:2px solid #9d7cff;
  box-shadow:0 7px 0 #6a4fd1,0 13px 18px rgba(34,89,102,.16);
  color:#17465d;font-weight:720;
}
.memory-button{
  margin-top:11px;border:0;border-radius:999px;
  padding:9px 16px;
  background:linear-gradient(180deg,#9d7cff,#6a4fd1);
  color:#fff;font-weight:800;cursor:pointer;
  box-shadow:0 4px 0 rgba(0,0,0,.16);
}
.memory-answer{display:none;margin-top:12px;color:var(--deep);line-height:1.43}
.memory-answer.visible{display:block}

/* ========================= CONTROLS ========================= */
.reader-controls{
  flex:0 0 auto;
  width:min(96vw,1700px);
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  margin-top:12px;
}
.control-left{justify-self:start}.control-right{justify-self:end}
.round-button{
  width:44px;height:44px;
  display:grid;place-items:center;
  border-radius:50%;
  border:1px solid rgba(22,100,128,.14);
  background:rgba(255,255,255,.95);
  color:#155f7c;
  cursor:pointer;
  box-shadow:0 6px 15px rgba(32,88,100,.11);
}
.round-button svg{
  width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2.1;
  stroke-linecap:round;stroke-linejoin:round;
}
.counter{
  min-width:142px;
  padding:8px 15px;
  border-radius:999px;
  text-align:center;
  background:rgba(255,255,255,.94);
  border:1px solid rgba(22,100,128,.12);
  color:#17617d;font-size:14px;font-weight:780;
  box-shadow:0 5px 13px rgba(32,88,100,.09);
}
.flip-hint{margin-top:7px;color:#6091a1;font-size:12px;text-align:center}
.corner-hit{
  position:absolute;z-index:100;bottom:0;
  width:82px;height:82px;border:0;background:transparent;cursor:pointer;
}
.corner-hit.prev{left:0}.corner-hit.next{right:0}
.corner-hit:disabled{pointer-events:none;opacity:0}
.corner-hit::before{
  content:"";position:absolute;inset:0;
  clip-path:polygon(100% 0,100% 100%,0 100%);
  background:linear-gradient(135deg,transparent 48%,rgba(255,255,255,.60) 50%,rgba(213,174,66,.23) 100%);
}
.corner-hit.prev::before{transform:scaleX(-1)}

/* ========================= MOBILE ========================= */
#mobileShell{display:none}
body.mobile-mode #desktopShell{display:none}
body.mobile-mode #mobileShell{display:block}
#mobileShell{
  position:relative;
  width:calc(100vw - 18px);
  height:calc(100dvh - 104px);
  max-width:560px;
  border-radius:22px;
  filter:drop-shadow(0 18px 22px rgba(30,69,71,.18));
}
#mobileShell::before{
  content:"";position:absolute;z-index:-3;
  inset:5px -4px -12px;
  border-radius:22px;
  background:linear-gradient(135deg,#0b654a,#073f30);
  border:2px solid rgba(219,174,57,.82);
}
#mobileShell::after{
  content:"";position:absolute;z-index:-2;
  left:7px;right:7px;bottom:-6px;height:16px;
  border-radius:0 0 13px 13px;
  background:repeating-linear-gradient(to bottom,#fff 0 2px,#d6dfe1 3px,#fff 5px);
}
.mobile-card{
  position:absolute;inset:0;
  overflow:hidden;
  border-radius:18px;
  background:var(--text-bg) center/cover no-repeat;
  box-shadow:0 4px 12px rgba(24,57,60,.12);
  will-change:transform,opacity;
}
.mobile-visual{
  position:absolute;left:0;right:0;top:0;height:38%;
  overflow:hidden;background:#dceff6;
}
.mobile-visual .scene{
  width:100%;height:100%;object-fit:cover;display:block;
}
.mobile-content{
  position:absolute;left:0;right:0;bottom:0;height:62%;
  overflow-y:auto;
  padding:17px 18px 30px;
  background:var(--text-bg) center/cover no-repeat;
  scrollbar-width:thin;
}
.mobile-content .story-text{font-size:18px!important;line-height:1.43}
.mobile-content .interactive-wrap{position:static;overflow:visible;padding:0}
.mobile-content .interactive-title{font-size:24px;margin-bottom:16px}
.mobile-content .task-toggle,.mobile-content .quiz-toggle{font-size:16px;padding:13px 14px}
.mobile-content .task-detail,.mobile-content .quiz-options{font-size:15px}
.mobile-scroll-hint{
  position:absolute;z-index:30;
  left:50%;bottom:8px;transform:translateX(-50%);
  display:none;
  padding:5px 10px;border-radius:999px;
  background:rgba(255,255,255,.93);
  color:#17617d;font-size:12px;font-weight:760;
  box-shadow:0 4px 12px rgba(32,88,100,.12);
  pointer-events:none;
}
.mobile-scroll-hint.show{display:block}
.mobile-card.interactive-mobile .mobile-visual{display:none}
.mobile-card.interactive-mobile .mobile-content{top:0;height:100%;padding-top:18px}
.mobile-jabuti-banner{
  position:relative;height:205px;
  margin:-18px -18px 18px;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 25%,rgba(255,255,255,.78),transparent 30%),
    var(--text-bg) center/cover no-repeat;
}
.mobile-jabuti-banner .mini-ground{
  position:absolute;left:24%;right:24%;bottom:10px;height:48px;border-radius:50%;
  background:linear-gradient(180deg,#82cc61,#557a3d 32%,#8d6d4c 33%,#654a35 100%);
  box-shadow:0 10px 18px rgba(41,69,54,.23);
}
.mobile-jabuti-banner img{
  position:absolute;left:50%;bottom:16px;width:36%;
  transform:translateX(-50%);
  filter:drop-shadow(0 12px 10px rgba(26,58,56,.20));
}
.mobile-jabuti-banner .mini-bubble{
  position:absolute;left:12px;right:12px;top:10px;
  padding:10px 12px;border-radius:16px;
  background:rgba(255,255,255,.94);
  color:var(--deep);font-size:15px;line-height:1.3;font-weight:780;text-align:center;
  box-shadow:0 5px 0 rgba(103,178,211,.22),0 10px 18px rgba(30,88,103,.12);
}
body.mobile-mode .reader-controls{width:calc(100vw - 24px);margin-top:10px}
body.mobile-mode .round-button{width:40px;height:40px}
body.mobile-mode .counter{min-width:115px;padding:7px 12px}
body.mobile-mode .flip-hint{display:none}
body.mobile-mode .cloud-layer{display:none}
body.mobile-mode .falling-jabuti{width:24%;animation-duration:5.5s}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>

<body>

<div id="loader">Завантаження книги…</div>

<section id="coverScreen">
  <div class="closed-book">
    <div class="cover-face" id="coverFace">
      <img id="coverImage" alt="Інтерактивна книга «Свято на небі»" draggable="false">
      <button class="open-corner" id="openBookButton" aria-label="Відкрити книгу"></button>
    </div>
  </div>
</section>

<section id="readerScreen">
  <div class="reader-stage">

    <div id="desktopShell">
      <div id="book"></div>
      <div class="book-gutter"></div>
      <button class="corner-hit prev" id="desktopPrev" aria-label="Попередня сторінка"></button>
      <button class="corner-hit next" id="desktopNext" aria-label="Наступна сторінка"></button>
    </div>

    <div id="mobileShell">
      <div class="mobile-card" id="mobileCard"></div>
      <div class="mobile-scroll-hint" id="mobileScrollHint">↓ прокрути текст</div>
      <button class="corner-hit prev" id="mobilePrev" aria-label="Попередня сторінка"></button>
      <button class="corner-hit next" id="mobileNext" aria-label="Наступна сторінка"></button>

/* =========================================================
   ASSETS — код сам знаходить .png / .jpg / .jpeg / .webp
   ========================================================= */
const assetBases = [
  "book-cover",
  "01","02","03","04","05","06","07","08","09","10","11","12","13",
  "toucan-invite","return-hide","final-scene",
  "clouds-01","clouds-02","jabuti","text-page-bg","falling-bg"
];

const assets = {};
const extensions = [".png",".jpg",".jpeg",".webp",".PNG",".JPG",".JPEG",".WEBP"];

function tryImage(url){
  return new Promise(resolve=>{
    const img = new Image();
    img.onload=()=>resolve(url);
    img.onerror=()=>resolve(null);
    img.src=url;
  });
}
async function resolveAsset(base){
  for(const ext of extensions){
    const found = await tryImage(base+ext);
    if(found) return found;
  }
  return base+".png";
}
async function preloadAssets(){
  await Promise.all(assetBases.map(async b=>assets[b]=await resolveAsset(b)));
  document.documentElement.style.setProperty("--text-bg",`url("${assets["text-page-bg"]}")`);
  document.documentElement.style.setProperty("--fall-bg",`url("${assets["falling-bg"]}")`);
  document.getElementById("coverImage").src=assets["book-cover"];
  document.getElementById("loader").classList.add("hidden");
}

function textFont(html){
  const plain=html.replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim();
  const n=plain.length;
  if(n<180)return 31;
  if(n<320)return 28;
  if(n<520)return 24;
  if(n<720)return 21.5;
  return 19.5;
}

function sceneHTML(spec){
  const pos=spec.pos?`pos-${spec.pos}`:"pos-center";
  return `<img class="scene ${pos}" src="${asset(spec.src)}" alt="" draggable="false">`;
}
function cloudHTML(reverse=false){
  return `<div class="cloud-layer ${reverse?"reverse":""}">

  </div>`;
}

function pageHTML(spec,side){
  if(spec.kind==="image"){
    return `<div class="page scene-page page-${side}">${sceneHTML(spec)}</div>`;
  }
  if(spec.kind==="flight"){
    return `<div class="page scene-page page-${side}">${sceneHTML(spec)}${cloudHTML(false)}</div>`;
  }
  if(spec.kind==="return-flight"){
    return `<div class="page scene-page page-${side}">${sceneHTML(spec)}${cloudHTML(true)}</div>`;
  }
  if(spec.kind==="falling"){
    return `<div class="page scene-page page-${side}">
      <div class="falling-scene">
        <img class="falling-jabuti" src="${asset("jabuti")}" alt="Джабуті">
      </div>
    </div>`;
  }
  if(spec.kind==="text"){
    return `<div class="page text-page page-${side}">
      <div class="text-wrap"><div class="story-text" style="font-size:${textFont(spec.html)}px">${spec.html}</div></div>
    </div>`;
  }
  if(spec.kind==="jabuti-panel"){
    return `<div class="page jabuti-page page-${side}">
      <div class="jabuti-stage">
        <div class="speech-bubble">${spec.bubble}</div>
        <div class="jabuti-ground"></div>
        <img class="quiz-jabuti" src="${asset("jabuti")}" alt="Джабуті">
      </div>
    </div>`;
  }
  if(spec.kind==="tasks"){
    return `<div class="page task-page page-${side}">${tasksHTML()}</div>`;
  }
  if(spec.kind==="quiz"){
    return `<div class="page quiz-page page-${side}">${quizHTML()}</div>`;
  }
  return `<div class="page page-${side}"></div>`;
}

function wireInteractive(root){
  root.querySelectorAll(".task-toggle").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const card=btn.closest(".task-card");
      root.querySelectorAll(".task-card.open").forEach(c=>{if(c!==card)c.classList.remove("open")});
      card.classList.toggle("open");
    });
  });
  root.querySelectorAll(".quiz-toggle").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const card=btn.closest(".quiz-card");
      root.querySelectorAll(".quiz-card.open").forEach(c=>{if(c!==card)c.classList.remove("open")});
      card.classList.toggle("open");
    });
  });
  root.querySelectorAll(".answer").forEach(btn=>{
    btn.addEventListener("click",e=>{
      e.stopPropagation();
      const card=btn.closest(".quiz-card");
      if(card.dataset.done==="true")return;
      if(btn.dataset.answer===card.dataset.correct){
        btn.classList.add("correct");
        card.dataset.done="true";
        celebrateJabuti();
      }else{
        btn.classList.add("wrong");
        setTimeout(()=>btn.classList.remove("wrong"),650);
      }
    });
  });
  const memory=root.querySelector("[data-memory]");
  if(memory){
    memory.addEventListener("click",()=>{
      const ans=root.querySelector(".memory-answer");
      if(ans)ans.classList.add("visible");
      celebrateJabuti();
    });
  }
}

function celebrateJabuti(){
  const root=mobileMode?document.getElementById("mobileCard"):book;
  const jab=root?.querySelector(".quiz-jabuti");
  if(!jab)return;
  jab.classList.remove("celebrate");
  void jab.offsetWidth;
  jab.classList.add("celebrate");
}

function updateCounter(){
  if(currentSpread<STORY_SPREADS)counter.textContent=`${currentSpread+1} / ${STORY_SPREADS}`;
  else if(currentSpread===STORY_SPREADS)counter.textContent="Після читання";
  else counter.textContent="Перевірка уважності";

  const atStart=currentSpread===0;
  const atEnd=currentSpread===spreads.length-1;
  document.getElementById("desktopPrev").disabled=atStart;
  document.getElementById("mobilePrev").disabled=atStart;
  document.getElementById("desktopNext").disabled=atEnd;
  document.getElementById("mobileNext").disabled=atEnd;
}

/* =========================================================
   DESKTOP — справжній St.PageFlip
   ========================================================= */
function initDesktop(startSpread=0){
  if(pageFlip){
    try{pageFlip.destroy()}catch(e){}
    pageFlip=null;
  }

  buildDesktopPages();

  if(!window.St || !St.PageFlip){
    /* безпечний fallback, якщо CDN тимчасово недоступний */
    book.innerHTML=pageHTML(spreads[startSpread].left,"left")+pageHTML(spreads[startSpread].right,"right");
    book.style.display="flex";
    Array.from(book.children).forEach(el=>{el.style.width="50%";el.style.height="100%"});
    currentSpread=startSpread;
    updateCounter();
    return;
  }

  const shellW=Math.max(900,desktopShell.clientWidth);
  const shellH=Math.max(500,desktopShell.clientHeight);
  const pageW=Math.floor(shellW/2);
  const pageH=Math.floor(shellH);

  pageFlip=new St.PageFlip(book,{
    width:pageW,
    height:pageH,
    size:"fixed",
    minWidth:pageW,
    maxWidth:pageW,
    minHeight:pageH,
    maxHeight:pageH,
    showCover:false,
    usePortrait:false,
    mobileScrollSupport:false,
    drawShadow:true,
    maxShadowOpacity:.48,
    flippingTime:1350,
    showPageCorners:true,
    disableFlipByClick:true,
    clickEventForward:false,
    autoSize:false
  });

  const pages=book.querySelectorAll(".page");
  pageFlip.loadFromHTML(pages);
  pageFlip.on("flip",e=>{
    currentSpread=Math.floor(e.data/2);
    updateCounter();
    setTimeout(()=>wireInteractive(book),30);
  });

  pageFlip.turnToPage(startSpread*2);
  currentSpread=startSpread;
  updateCounter();
}

/* =========================================================
   MOBILE — окремий легкий режим
   ========================================================= */
function mobilePageHTML(spread){
  const left=spread.left;
  const right=spread.right;
  const interactive=right.kind==="tasks"||right.kind==="quiz";
  const jabutiHeader=left.kind==="jabuti-panel";

  if(interactive){
    const content=right.kind==="tasks"?tasksHTML():quizHTML();
    return `
      <div class="mobile-card interactive-mobile" id="mobileCard">
        <div class="mobile-content">
          ${jabutiHeader?`
            <div class="mobile-jabuti-banner">
              <div class="mini-bubble">${left.bubble}</div>
              <div class="mini-ground"></div>
              <img src="${asset("jabuti")}" alt="Джабуті">
            </div>`:""}
          ${content}
        </div>
      </div>`;
  }

  let visual="";
  if(left.kind==="falling"){
    visual=`<div class="mobile-visual">
      <div class="falling-scene">
        <img class="falling-jabuti" src="${asset("jabuti")}" alt="Джабуті">
      </div>
    </div>`;
  }else{
    const pos=left.pos?`pos-${left.pos}`:"pos-center";
    visual=`<div class="mobile-visual">
      <img class="scene ${pos}" src="${asset(left.src)}" alt="">
    </div>`;
  }

  return `
    <div class="mobile-card" id="mobileCard">
      ${visual}
      <div class="mobile-content">
        ${right.kind==="text"?`<div class="story-text">${right.html}</div>`:""}
      </div>
    </div>`;
}

function renderMobile(){
  const old=document.getElementById("mobileCard");
  old.outerHTML=mobilePageHTML(spreads[currentSpread]);
  const fresh=document.getElementById("mobileCard");
  wireInteractive(fresh);
  setupMobileScrollHint();
  updateCounter();
}

function setupMobileScrollHint(){
  const card=document.getElementById("mobileCard");
  const content=card?.querySelector(".mobile-content");
  if(!content){
    mobileScrollHint.classList.remove("show");
    return;
  }
  const update=()=>{
    const canScroll=content.scrollHeight>content.clientHeight+8;
    const nearBottom=content.scrollTop+content.clientHeight>=content.scrollHeight-12;
    mobileScrollHint.classList.toggle("show",canScroll&&!nearBottom);
  };
  update();
  content.addEventListener("scroll",update,{passive:true});
}

async function mobileTurn(direction){
  if(mobileTurning)return;
  const next=currentSpread+direction;
  if(next<0||next>=spreads.length)return;

  mobileTurning=true;
  const card=document.getElementById("mobileCard");
  const out=card.animate([
    {transform:"translateX(0) scale(1)",opacity:1},
    {transform:`translateX(${direction>0?-8:8}%) scale(.99)`,opacity:0}
  ],{
    duration:240,
    easing:"cubic-bezier(.35,0,.2,1)",
    fill:"forwards"
  });

  await out.finished;
  currentSpread=next;
  renderMobile();

  const fresh=document.getElementById("mobileCard");
  const incoming=fresh.animate([
    {transform:`translateX(${direction>0?8:-8}%) scale(.99)`,opacity:0},
    {transform:"translateX(0) scale(1)",opacity:1}
  ],{
    duration:280,
    easing:"cubic-bezier(.18,.72,.18,1)",
    fill:"forwards"
  });

  await incoming.finished;
  incoming.cancel();
  mobileTurning=false;
}

/* =========================================================
   MODE + EVENTS
   ========================================================= */
function detectMode(){
  mobileMode=window.innerWidth<=780&&window.innerHeight>window.innerWidth;
  document.body.classList.toggle("mobile-mode",mobileMode);
}

function openReader(){
  detectMode();
  coverFace.classList.add("opening");
  setTimeout(()=>{
    coverScreen.style.display="none";
    readerScreen.classList.add("visible");
    if(mobileMode)renderMobile();
    else initDesktop(currentSpread);
  },760);
}

document.getElementById("openBookButton").addEventListener("click",openReader);

document.getElementById("desktopNext").addEventListener("click",()=>{
  if(pageFlip)pageFlip.flipNext();
  else{
    currentSpread=Math.min(spreads.length-1,currentSpread+1);
    initDesktop(currentSpread);
  }
});
document.getElementById("desktopPrev").addEventListener("click",()=>{
  if(pageFlip)pageFlip.flipPrev();
  else{
    currentSpread=Math.max(0,currentSpread-1);
    initDesktop(currentSpread);
  }
});
document.getElementById("mobileNext").addEventListener("click",()=>mobileTurn(1));
document.getElementById("mobilePrev").addEventListener("click",()=>mobileTurn(-1));

window.addEventListener("keydown",e=>{
  if(!readerScreen.classList.contains("visible"))return;
  if(e.key==="ArrowRight"){
    if(mobileMode)mobileTurn(1);
    else if(pageFlip)pageFlip.flipNext();
  }
  if(e.key==="ArrowLeft"){
    if(mobileMode)mobileTurn(-1);
    else if(pageFlip)pageFlip.flipPrev();
  }
});

document.getElementById("homeButton").addEventListener("click",()=>{
  readerScreen.classList.remove("visible");
  coverScreen.style.display="flex";
  coverFace.classList.remove("opening");
  currentSpread=0;
  updateCounter();
});

document.getElementById("fullscreenButton").addEventListener("click",async()=>{
  try{
    if(!document.fullscreenElement)await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  }catch(e){}
});

let resizeTimer;
window.addEventListener("resize",()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>{
    if(!readerScreen.classList.contains("visible"))return;
    detectMode();
    if(mobileMode)renderMobile();
    else initDesktop(currentSpread);
  },220);
});

preloadAssets().then(()=>{
  detectMode();
  updateCounter();
});
</script>
</body>
</html>
