<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Свято на небі — інтерактивна книга</title>

<style>
/* =========================================================
   ОСНОВА
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

html {
    background: #f5fcff;
}

body {
    height: 100dvh;
    overflow: hidden;

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    color: #173d52;

    background:
        radial-gradient(
            circle at 7% 14%,
            rgba(97, 220, 196, .16),
            transparent 28%
        ),
        radial-gradient(
            circle at 92% 82%,
            rgba(86, 193, 240, .18),
            transparent 27%
        ),
        linear-gradient(
            135deg,
            #ffffff 0%,
            #eefaff 52%,
            #fbfeff 100%
        );
}

button {
    font-family: inherit;
}


/* =========================================================
   ОБКЛАДИНКА
========================================================= */

#coverScreen {
    position: fixed;
    inset: 0;

    z-index: 1000;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 18px;

    perspective: 2400px;
}

.closed-book {
    position: relative;

    width: min(
        92vw,
        calc((100dvh - 42px) * 16 / 9),
        1450px
    );

    aspect-ratio: 16 / 9;

    transform-style: preserve-3d;

    filter:
        drop-shadow(
            0 32px 28px
            rgba(29, 68, 69, .25)
        );
}

/* блок сторінок */
.closed-book::before {
    content: "";

    position: absolute;

    z-index: -2;

    left: 2.8%;
    right: .6%;

    top: 2%;
    bottom: -17px;

    border-radius:
        5px 17px 18px 5px;

    background:
        repeating-linear-gradient(
            to bottom,
            #ffffff 0px,
            #ffffff 2px,
            #d6dfe2 3px,
            #ffffff 5px
        );

    box-shadow:
        5px 11px 18px
        rgba(30, 57, 60, .17);
}

/* тверда задня обкладинка */
.closed-book::after {
    content: "";

    position: absolute;

    z-index: -3;

    left: .9%;
    right: -.5%;

    top: .8%;
    bottom: -26px;

    border-radius:
        6px 18px 21px 6px;

    background:
        linear-gradient(
            90deg,
            #063b2d,
            #0c674b 36%,
            #073e30
        );

    border:
        2px solid
        rgba(220, 175, 57, .84);
}

.cover-face {
    position: absolute;
    inset: 0;

    overflow: hidden;

    border-radius:
        6px 18px 18px 6px;

    transform-origin:
        left center;

    transform-style: preserve-3d;

    transition:
        transform 1.15s
        cubic-bezier(.2,.75,.18,1),
        opacity .9s ease;
}

.cover-face.opening {
    transform:
        rotateY(-108deg)
        translateX(-2%);

    opacity: .06;
}

.cover-face img {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;
}

.open-corner {
    position: absolute;

    z-index: 20;

    right: 0;
    bottom: 0;

    width: 105px;
    height: 105px;

    border: 0;
    background: transparent;

    cursor: pointer;
}

.open-corner::before {
    content: "";

    position: absolute;
    inset: 0;

    clip-path:
        polygon(
            100% 0,
            100% 100%,
            0 100%
        );

    background:
        linear-gradient(
            135deg,
            transparent 47%,
            rgba(255,255,255,.82) 50%,
            rgba(233,243,244,.97) 100%
        );

    filter:
        drop-shadow(
            -4px -4px 7px
            rgba(0,0,0,.12)
        );

    transition:
        transform .22s ease;
}

.open-corner:hover::before {
    transform:
        translate(-5px,-5px);
}


/* =========================================================
   ЧИТАННЯ
========================================================= */

#readerScreen {
    position: fixed;
    inset: 0;

    display: none;

    flex-direction: column;
    align-items: center;
    justify-content: flex-start;

    overflow: hidden;

    padding:
        8px
        8px
        8px;
}

#readerScreen.visible {
    display: flex;
}

.reader-stage {
    flex: 0 0 auto;

    display: flex;
    align-items: center;
    justify-content: center;

    width: 100%;
}


/* =========================================================
   DESKTOP BOOK
========================================================= */

#desktopBook {
    position: relative;

    transform-style: preserve-3d;

    perspective: 2800px;

    filter:
        drop-shadow(
            0 28px 29px
            rgba(31, 68, 70, .20)
        );
}

.book-back {
    position: absolute;

    z-index: -6;

    inset:
        4px
        -8px
        -18px
        -8px;

    border-radius:
        20px 20px 24px 24px;

    background:
        linear-gradient(
            90deg,
            #063a2c 0%,
            #0b6248 17%,
            #074433 50%,
            #0b6248 83%,
            #063a2c 100%
        );

    border:
        2px solid
        rgba(219, 174, 57, .88);

    box-shadow:
        inset 0 0 0 2px
        rgba(255, 217, 98, .13);
}

.bottom-pages {
    position: absolute;

    z-index: -4;

    left: 11px;
    right: 11px;

    bottom: -9px;

    height: 24px;

    border-radius:
        0 0 14px 14px;

    background:
        repeating-linear-gradient(
            to bottom,
            #ffffff 0px,
            #ffffff 2px,
            #d5dfe1 3px,
            #ffffff 5px
        );

    box-shadow:
        0 8px 12px
        rgba(27, 57, 60, .14);
}

.stack-left,
.stack-right {
    position: absolute;

    z-index: -3;

    top: 8px;
    bottom: 6px;

    background:
        repeating-linear-gradient(
            90deg,
            #ffffff 0,
            #ffffff 2px,
            #d1dcdf 3px,
            #ffffff 5px
        );

    transition:
        width .45s ease;

    box-shadow:
        0 4px 8px
        rgba(20, 45, 48, .11);
}

.stack-left {
    left: -5px;

    width:
        var(--left-stack, 5px);

    border-radius:
        12px 0 0 12px;
}

.stack-right {
    right: -5px;

    width:
        var(--right-stack, 26px);

    border-radius:
        0 12px 12px 0;
}


/* =========================================================
   РОЗВОРОТ
========================================================= */

.spread {
    position: absolute;
    inset: 0;

    display: flex;

    overflow: visible;

    border-radius: 13px;

    background: #ffffff;

    box-shadow:
        0 4px 10px
        rgba(27, 60, 64, .10);

    transform-style: preserve-3d;
}

.page {
    position: relative;

    width: 50%;
    height: 100%;

    overflow: hidden;

    background: #ffffff;
}

.left-page {
    border-radius:
        12px 1px 1px 12px;
}

.right-page {
    border-radius:
        1px 12px 12px 1px;
}


/* =========================================================
   СПРАВЖНІШИЙ ЗГИН
========================================================= */

/* легка тінь сторінок біля корінця */
.left-page::after {
    content: "";

    position: absolute;

    z-index: 30;

    right: 0;
    top: 0;
    bottom: 0;

    width: 49px;

    pointer-events: none;

    background:
        linear-gradient(
            to left,
            rgba(6,16,18,.30) 0%,
            rgba(14,29,32,.18) 14%,
            rgba(23,42,45,.08) 43%,
            transparent 100%
        );
}

.right-page::before {
    content: "";

    position: absolute;

    z-index: 30;

    left: 0;
    top: 0;
    bottom: 0;

    width: 49px;

    pointer-events: none;

    background:
        linear-gradient(
            to right,
            rgba(6,16,18,.30) 0%,
            rgba(14,29,32,.18) 14%,
            rgba(23,42,45,.08) 43%,
            transparent 100%
        );
}

/* сам жолобок */
.gutter-shadow {
    position: absolute;

    z-index: 75;

    left: 50%;

    top: 0;
    bottom: 0;

    width: 62px;

    transform:
        translateX(-50%);

    pointer-events: none;

    background:
        linear-gradient(
            90deg,
            transparent 0%,
            rgba(13,26,29,.05) 17%,
            rgba(6,16,18,.25) 38%,
            rgba(1,8,9,.51) 47%,
            rgba(0,0,0,.60) 49.3%,
            rgba(255,255,255,.22) 50%,
            rgba(0,0,0,.56) 50.7%,
            rgba(1,8,9,.48) 53%,
            rgba(6,16,18,.23) 62%,
            rgba(13,26,29,.05) 83%,
            transparent 100%
        );

    filter:
        blur(.35px);
}


/* =========================================================
   ІЛЮСТРАЦІЇ БЕЗ ОБРІЗАННЯ
========================================================= */

.scene-page {
    background: #e7f7fc;
}

.scene-frame {
    position: absolute;
    inset: 0;

    overflow: hidden;

    background: #d9f2f9;
}

.scene-blur {
    position: absolute;

    inset: -9%;

    background-image:
        var(--scene);

    background-size: cover;
    background-position: center;

    filter:
        blur(22px)
        brightness(.91)
        saturate(.92);

    opacity: .72;

    transform:
        scale(1.08);
}

.scene-tint {
    position: absolute;
    inset: 0;

    background:
        rgba(255,255,255,.07);
}

.scene-image {
    position: absolute;

    z-index: 3;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    display: block;

    filter:
        drop-shadow(
            0 2px 4px
            rgba(0,0,0,.12)
        );
}


/* =========================================================
   TEXT PAGE
========================================================= */

.text-page,
.task-page,
.quiz-page {
    background:
        url("text-page-bg.png")
        center / cover no-repeat;
}

.text-wrap {
    position: absolute;

    z-index: 5;

    left: 8.3%;
    right: 8.2%;

    top: 7.5%;
    bottom: 7.5%;

    display: flex;
    flex-direction: column;

    justify-content: center;
}

.story-text {
    color: #183e53;

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    font-weight: 420;

    line-height: 1.46;

    text-align: left;
}

.story-text p {
    margin:
        0 0 .69em;
}

.story-text strong,
.dialogue {
    color: #075676;
    font-weight: 720;
}


/* =========================================================
   CLOUDS
========================================================= */

.cloud-layer {
    position: absolute;

    z-index: 9;

    inset: 0;

    overflow: hidden;

    pointer-events: none;
}

.cloud {
    position: absolute;

    height: auto;

    pointer-events: none;
}

.cloud-a {
    width: 61%;

    top: 8%;
    left: -66%;

    opacity: .58;

    animation:
        cloudRight
        17s linear infinite;
}

.cloud-b {
    width: 44%;

    top: 57%;
    left: -55%;

    opacity: .42;

    animation:
        cloudRight
        27s linear infinite;

    animation-delay: -10s;
}

.cloud-layer.reverse .cloud-a {
    left: auto;
    right: -66%;

    animation-name: cloudLeft;
}

.cloud-layer.reverse .cloud-b {
    left: auto;
    right: -55%;

    animation-name: cloudLeft;
}

@keyframes cloudRight {

    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(280%);
    }

}

@keyframes cloudLeft {

    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(-280%);
    }

}


/* =========================================================
   FALL
========================================================= */

.falling-scene {
    position: absolute;

    inset: 0;

    overflow: hidden;

    background:
        url("falling-bg.png")
        center / cover no-repeat;
}

.falling-scene .cloud-a {
    animation-duration: 7s;
}

.falling-scene .cloud-b {
    animation-duration: 10s;
}

.falling-jabuti {
    position: absolute;

    z-index: 15;

    left: 50%;
    top: -8%;

    width: 27%;

    transform-origin: center;

    filter:
        drop-shadow(
            0 14px 16px
            rgba(14, 47, 54, .17)
        );

    animation:
        jabutiFall
        4.3s
        cubic-bezier(.38,.04,.74,.72)
        infinite;
}

@keyframes jabutiFall {

    0% {
        transform:
            translate(-50%,-10%)
            rotate(-12deg)
            scale(.68);
    }

    32% {
        transform:
            translate(-35%,80%)
            rotate(15deg)
            scale(.80);
    }

    65% {
        transform:
            translate(-59%,178%)
            rotate(-18deg)
            scale(.94);
    }

    100% {
        transform:
            translate(-42%,315%)
            rotate(23deg)
            scale(1.11);
    }

}


/* =========================================================
   ДЖАБУТІ — ІНТЕРАКТИВ
========================================================= */

.jabuti-panel {
    position: absolute;

    inset: 0;

    overflow: hidden;

    background:
        url("text-page-bg.png")
        center / cover no-repeat;
}

.jabuti-panel::after {
    content: "";

    position: absolute;

    left: 14%;
    right: 14%;

    bottom: 3%;

    height: 14%;

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse,
            rgba(42, 111, 83, .16),
            transparent 68%
        );

    filter: blur(8px);
}

.quiz-jabuti {
    position: absolute;

    z-index: 5;

    width: 48%;

    left: 50%;
    bottom: 4%;

    transform:
        translateX(-50%);

    transform-origin:
        center bottom;

    filter:
        drop-shadow(
            0 14px 14px
            rgba(25, 59, 60, .18)
        );

    animation:
        jabutiIdle
        3.1s ease-in-out infinite;
}

@keyframes jabutiIdle {

    0%,
    100% {
        transform:
            translateX(-50%)
            translateY(0)
            rotate(-1deg);
    }

    50% {
        transform:
            translateX(-50%)
            translateY(-9px)
            rotate(1.4deg);
    }

}

.quiz-jabuti.celebrate {
    animation:
        celebrate
        .64s ease;
}

@keyframes celebrate {

    0% {
        transform:
            translateX(-50%)
            scale(1);
    }

    34% {
        transform:
            translateX(-50%)
            translateY(-17px)
            rotate(-4deg)
            scale(1.06);
    }

    70% {
        transform:
            translateX(-50%)
            rotate(4deg)
            scale(1.04);
    }

    100% {
        transform:
            translateX(-50%)
            scale(1);
    }

}

.speech-bubble {
    position: absolute;

    z-index: 8;

    top: 8.5%;
    left: 9%;
    right: 9%;

    padding:
        16px 20px;

    border-radius: 22px;

    background:
        rgba(255,255,255,.93);

    border:
        1px solid
        rgba(15, 99, 132, .16);

    box-shadow:
        0 8px 20px
        rgba(25, 80, 97, .10);

    color: #075676;

    font-size:
        clamp(16px, 1.2vw, 22px);

    line-height: 1.36;

    text-align: center;

    font-weight: 720;
}


/* =========================================================
   TASKS
========================================================= */

.interactive-wrap {
    position: absolute;

    z-index: 5;

    inset: 6.7% 7%;

    overflow-y: auto;

    padding-right: 3px;

    scrollbar-width: thin;
}

.interactive-title {
    margin:
        0 0 14px;

    color: #075676;

    font-size:
        clamp(23px, 1.55vw, 30px);

    line-height: 1.16;

    font-weight: 800;
}

.cards {
    display: grid;
    gap: 10px;
}

.task-card,
.quiz-card {
    border:
        1px solid
        rgba(17, 102, 136, .17);

    border-radius: 17px;

    overflow: hidden;

    background:
        rgba(255,255,255,.92);

    box-shadow:
        0 5px 13px
        rgba(30, 89, 103, .08);

    transition:
        transform .18s ease,
        box-shadow .18s ease;
}

.task-card:hover,
.quiz-card:hover {
    transform:
        translateY(-1px);

    box-shadow:
        0 8px 17px
        rgba(30,89,103,.12);
}

.task-toggle,
.quiz-toggle {
    width: 100%;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 10px;

    border: 0;
    background: transparent;

    padding:
        12px 15px;

    color: #17465d;

    font-size:
        clamp(14px, .94vw, 18px);

    line-height: 1.35;

    font-weight: 720;

    text-align: left;

    cursor: pointer;
}

.task-toggle::after,
.quiz-toggle::after {
    content: "+";

    flex: 0 0 auto;

    width: 25px;
    height: 25px;

    display: grid;
    place-items: center;

    border-radius: 50%;

    background:
        rgba(22,112,145,.09);

    color: #126988;

    font-size: 19px;

    transition:
        transform .23s ease;
}

.task-card.open
.task-toggle::after,
.quiz-card.open
.quiz-toggle::after {
    transform:
        rotate(45deg);
}

.task-detail,
.quiz-options {
    max-height: 0;

    overflow: hidden;

    opacity: 0;

    padding:
        0 15px;

    color: #285268;

    line-height: 1.42;

    transition:
        max-height .32s ease,
        opacity .24s ease,
        padding .30s ease;
}

.task-card.open
.task-detail,
.quiz-card.open
.quiz-options {
    max-height: 230px;

    opacity: 1;

    padding:
        0 15px 14px;
}

.answer-row {
    display: flex;
    flex-wrap: wrap;

    gap: 7px;
}

.answer {
    border:
        1px solid
        rgba(15, 99, 136, .18);

    border-radius: 999px;

    background: #ffffff;

    color: #13546e;

    padding:
        7px 12px;

    cursor: pointer;

    transition: .17s ease;
}

.answer:hover {
    transform:
        translateY(-1px);
}

.answer.correct {
    background: #dff4e3;
    border-color: #65b57d;
    color: #236239;
}

.answer.wrong {
    background: #ffe5e5;
    border-color: #d47b7b;
    color: #913f3f;

    animation:
        wrongShake
        .28s ease;
}

@keyframes wrongShake {

    0%,
    100% {
        transform: translateX(0);
    }

    35% {
        transform: translateX(-4px);
    }

    70% {
        transform: translateX(4px);
    }

}

.memory-card {
    margin-top: 11px;

    padding:
        14px 16px;

    border-radius: 17px;

    background:
        rgba(255,255,255,.93);

    border:
        1px solid
        rgba(16,101,136,.17);

    color: #17465d;

    box-shadow:
        0 5px 13px
        rgba(30,89,103,.08);
}

.memory-button {
    margin-top: 10px;

    border: 0;

    border-radius: 999px;

    padding:
        8px 15px;

    color: white;
    background: #0d698b;

    font-weight: 700;

    cursor: pointer;
}

.memory-answer {
    display: none;

    margin-top: 12px;

    color: #075676;

    line-height: 1.43;
}

.memory-answer.visible {
    display: block;
}


/* =========================================================
   DESKTOP PAGE TURN
========================================================= */

.turn-sheet {
    display: none;

    position: absolute;

    z-index: 100;

    left: 50%;
    top: 0;

    width: 50%;
    height: 100%;

    transform-origin:
        left center;

    transform-style:
        preserve-3d;

    pointer-events: none;
}

.turn-sheet.active {
    display: block;
}

.sheet-face {
    position: absolute;

    inset: 0;

    overflow: hidden;

    backface-visibility: hidden;

    background: #ffffff;
}

.sheet-front {
    border-radius:
        1px 12px 12px 1px;

    box-shadow:
        -8px 2px 18px
        rgba(0,0,0,.13);
}

.sheet-back {
    transform:
        rotateY(180deg);

    border-radius:
        12px 1px 1px 12px;

    box-shadow:
        8px 2px 18px
        rgba(0,0,0,.14);
}

.sheet-gloss {
    position: absolute;

    z-index: 200;

    inset: 0;

    pointer-events: none;

    opacity: 0;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.02),
            rgba(0,0,0,.25) 38%,
            rgba(255,255,255,.19) 52%,
            rgba(0,0,0,.12) 100%
        );
}


/* =========================================================
   CORNERS
========================================================= */

.page-corner {
    position: absolute;

    z-index: 160;

    bottom: 0;

    width: 75px;
    height: 75px;

    border: 0;
    background: transparent;

    cursor: pointer;

    opacity: .61;

    transition:
        opacity .18s ease,
        transform .18s ease;
}

.page-corner:hover {
    opacity: 1;
    transform: scale(1.05);
}

.page-corner:disabled {
    opacity: 0;
    pointer-events: none;
}

.corner-next {
    right: 0;
}

.corner-prev {
    left: 0;
}

.page-corner::before {
    content: "";

    position: absolute;

    inset: 0;

    clip-path:
        polygon(
            100% 0,
            100% 100%,
            0 100%
        );

    background:
        linear-gradient(
            135deg,
            transparent 47%,
            rgba(255,255,255,.69) 50%,
            rgba(215,177,71,.26) 100%
        );
}

.corner-prev::before {
    transform:
        scaleX(-1);
}


/* =========================================================
   MOBILE BOOK
========================================================= */

#mobileBook {
    display: none;

    position: relative;

    perspective: 2200px;

    filter:
        drop-shadow(
            0 18px 22px
            rgba(30, 69, 71, .18)
        );
}

.mobile-back {
    position: absolute;

    z-index: -3;

    inset:
        5px
        -5px
        -15px;

    border-radius: 19px;

    background:
        linear-gradient(
            135deg,
            #0b654a,
            #073f30
        );

    border:
        2px solid
        rgba(219,174,57,.82);
}

.mobile-paper-edge {
    position: absolute;

    z-index: -2;

    left: 7px;

function sceneHTML(

                draggable="false"

    `;

}


function cloudHTML(
    reverse = false
) {

    return `
        <div
            class="cloud-layer
            ${reverse ? "reverse" : ""}"

                class="cloud cloud-a"

            >

/* =========================================================
   BUILD PAGE
========================================================= */

function buildPage(
    spec
) {

    if (
        spec.kind === "image"
    ) {

        return {
            className: "scene-page",

            html:
                sceneHTML(
                    spec.src
                )
        };

    }


    if (
        spec.kind === "flight"
    ) {

        return {
            className: "scene-page",

            html:
                sceneHTML(
                    spec.src
                )
                +
                cloudHTML(false)
        };

    }


    if (
        spec.kind ===
        "return-flight"
    ) {

        return {
            className: "scene-page",

            html:
                sceneHTML(
                    spec.src
                )
                +
                cloudHTML(true)
        };

    }


    if (
        spec.kind === "falling"
    ) {

        return {
            className: "scene-page",

            html: `
                <div class="falling-scene">

                    ${cloudHTML(false)}

                    <img
                        class="falling-jabuti"
                        src="jabuti.png"
                        alt="Джабуті"
                    >

                </div>
            `
        };

    }


    if (
        spec.kind === "text"
    ) {

        return {
            className: "text-page",

            html: `
                <div class="text-wrap">

                    <div class="story-text">
                        ${spec.html}
                    </div>

                </div>
            `
        };

    }


    if (
        spec.kind ===
        "jabuti-panel"
    ) {

        return {
            className: "scene-page",

            html: `
                <div class="jabuti-panel">

                    <div class="speech-bubble">
                        ${spec.bubble}
                    </div>

                    <img
                        class="quiz-jabuti"
                        src="jabuti.png"
                        alt="Джабуті"
                    >

                </div>
            `
        };

    }


    if (
        spec.kind === "tasks"
    ) {

        return {
            className: "task-page",

            html:
                tasksHTML()
        };

    }


    if (
        spec.kind === "quiz"
    ) {

        return {
            className: "quiz-page",

            html:
                quizHTML()
        };

    }


    return {
        className: "",
        html: ""
    };

}

/* =========================================================
   RESPONSIVE MODE
========================================================= */

function detectMode() {

    const nextMobileMode =
        window.innerWidth <= 780
        &&
        window.innerHeight >
        window.innerWidth;


    if (
        nextMobileMode
        !== mobileMode
    ) {

        mobileMode =
            nextMobileMode;

        document.body
            .classList
            .toggle(
                "mobile-mode",
                mobileMode
            );

    }

}


/* =========================================================
   SIZE
========================================================= */

function fitBookToViewport() {

    detectMode();


    const vw =
        window.innerWidth;

    const vh =
        window.innerHeight;


    if (
        mobileMode
    ) {

        const width =
            Math.max(
                280,
                vw - 20
            );

        const availableHeight =
            Math.max(
                430,
                vh - 116
            );

        const height =
            Math.min(
                availableHeight,
                width * 1.52
            );


        mobileBook.style.width =
            `${width}px`;

        mobileBook.style.height =
            `${height}px`;


        return;
    }


    const availableW =
        vw - 24;

    const availableH =
        vh - 105;


    let width =
        Math.min(
            availableW,
            availableH
                * 16 / 9,
            1760
        );


    let height =
        width * 9 / 16;


    desktopBook.style.width =
        `${width}px`;

    desktopBook.style.height =
        `${height}px`;

}

function applyDesktopPage(

    element.innerHTML =

}


/* =========================================================
   TEXT FIT
========================================================= */

function fitStoryText(
    root,
    mobile = false
) {

    const blocks =
        root.querySelectorAll(
            ".story-text"
        );


    blocks.forEach(
        block => {

            const holder =
                block.parentElement;

            const textLength =
                block.innerText
                    .replace(
                        /\s+/g,
                        " "
                    )
                    .trim()
                    .length;


            let size;


            if (
                mobile
            ) {

                size =
                    textLength < 240
                    ? 22
                    : textLength < 480
                    ? 20
                    : 18;

            }

            else {

                size =
                    textLength < 210
                    ? 33
                    : textLength < 390
                    ? 29
                    : textLength < 620
                    ? 25.5
                    : 23;

            }


            block.style.fontSize =
                `${size}px`;


            while (
                block.scrollHeight >
                holder.clientHeight
                &&
                size >
                    (
                        mobile
                        ? 15
                        : 17
                    )
            ) {

                size -= .5;

                block.style.fontSize =
                    `${size}px`;

            }

        }
    );

}

/* =========================================================
   DESKTOP FORWARD
========================================================= */

async function desktopNextSpread() {

    if (
        turning
        ||
        currentSpread >=
            spreads.length - 1
    ) {
        return;
    }


    turning = true;


    const current =
        spreads[currentSpread];

    const next =
        spreads[currentSpread + 1];


    const front =
        buildPage(
            current.right
        );

    const back =
        buildPage(
            next.left
        );


    sheetFront.className =
        `sheet-face sheet-front ${front.className}`;

    sheetFront.innerHTML =
        front.html;


    sheetBack.className =
        `sheet-face sheet-back ${back.className}`;

    sheetBack.innerHTML =
        back.html;


    applyDesktopPage(
        rightPage,
        next.right,
        "right"
    );


    turnSheet.classList.add(
        "active"
    );


    const turnAnimation =
        turnSheet.animate(
            [

                {
                    offset: 0,

                    transform:
                        "rotateY(0deg) skewY(0deg) scaleX(1)",

                    filter:
                        "brightness(1)"
                },

                {
                    offset: .16,

                    transform:
                        "rotateY(-18deg) skewY(-1deg) scaleX(.995)",

                    filter:
                        "brightness(.98)"
                },

                {
                    offset: .39,

                    transform:
                        "rotateY(-65deg) skewY(-2.4deg) scaleX(.965)",

                    filter:
                        "brightness(.93)"
                },

                {
                    offset: .52,

                    transform:
                        "rotateY(-92deg) skewY(-3.1deg) scaleX(.925)",

                    filter:
                        "brightness(.88)"
                },

                {
                    offset: .70,

                    transform:
                        "rotateY(-137deg) skewY(-1.8deg) scaleX(.955)",

                    filter:
                        "brightness(.92)"
                },

                {
                    offset: .88,

                    transform:
                        "rotateY(-169deg) skewY(-.5deg) scaleX(.99)",

                    filter:
                        "brightness(.98)"
                },

                {
                    offset: 1,

                    transform:
                        "rotateY(-180deg) skewY(0deg) scaleX(1)",

                    filter:
                        "brightness(1)"
                }

            ],

            {
                duration: 1320,

                easing:
                    "cubic-bezier(.18,.70,.18,1)",

                fill: "forwards"
            }
        );


    sheetGloss.animate(
        [

            {
                opacity: .04
            },

            {
                offset: .48,
                opacity: .72
            },

            {
                opacity: .06
            }

        ],

        {
            duration: 1320,

            easing: "ease-in-out",

            fill: "forwards"
        }
    );


    await turnAnimation.finished;


    currentSpread++;


    turnSheet.classList.remove(
        "active"
    );


    turnAnimation.cancel();


    renderDesktop();


    turning = false;

}


/* =========================================================
   DESKTOP BACK
========================================================= */

async function desktopPreviousSpread() {

    if (
        turning
        ||
        currentSpread <= 0
    ) {
        return;
    }


    turning = true;


    const current =
        spreads[currentSpread];

    const previous =
        spreads[currentSpread - 1];


    applyDesktopPage(
        leftPage,
        previous.left,
        "left"
    );


    const front =
        buildPage(
            previous.right
        );

    const back =
        buildPage(
            current.left
        );


    sheetFront.className =
        `sheet-face sheet-front ${front.className}`;

    sheetFront.innerHTML =
        front.html;


    sheetBack.className =
        `sheet-face sheet-back ${back.className}`;

    sheetBack.innerHTML =
        back.html;


    turnSheet.classList.add(
        "active"
    );


    const turnAnimation =
        turnSheet.animate(
            [

                {
                    transform:
                        "rotateY(-180deg) skewY(0deg) scaleX(1)"
                },

                {
                    offset: .18,

                    transform:
                        "rotateY(-163deg) skewY(.6deg) scaleX(.99)"
                },

                {
                    offset: .44,

                    transform:
                        "rotateY(-112deg) skewY(2.6deg) scaleX(.94)"
                },

                {
                    offset: .55,

                    transform:
                        "rotateY(-86deg) skewY(3deg) scaleX(.925)"
                },

                {
                    offset: .75,

                    transform:
                        "rotateY(-39deg) skewY(1.4deg) scaleX(.97)"
                },

                {
                    transform:
                        "rotateY(0deg) skewY(0deg) scaleX(1)"
                }

            ],

            {
                duration: 1320,

                easing:
                    "cubic-bezier(.18,.70,.18,1)",

                fill: "forwards"
            }
        );


    sheetGloss.animate(
        [

            {
                opacity: .05
            },

            {
                offset: .52,
                opacity: .70
            },

            {
                opacity: .04
            }

        ],

        {
            duration: 1320,
            easing: "ease-in-out"
        }
    );


    await turnAnimation.finished;


    currentSpread--;


    turnSheet.classList.remove(
        "active"
    );


    turnAnimation.cancel();


    renderDesktop();


    turning = false;

}


/* =========================================================
   MOBILE TURN
========================================================= */

async function mobileTurn(
    direction
) {

    if (
        turning
    ) {
        return;
    }


    const nextIndex =
        currentSpread
        +
        direction;


    if (
        nextIndex < 0
        ||
        nextIndex >=
            spreads.length
    ) {
        return;
    }


    turning = true;


    const oldHTML =
        mobilePage.innerHTML;


    const nextSpread =
        spreads[nextIndex];


    mobilePage.innerHTML =
        buildMobilePageHTML(
            nextSpread
        );


    mobileTurnCard.innerHTML =
        oldHTML;


    mobileTurnCard.classList.add(
        "active"
    );


    let frames;


    if (
        direction > 0
    ) {

        frames = [

            {
                transform:
                    "rotateY(0deg) skewY(0deg) scaleX(1)",

                opacity: 1
            },

            {
                offset: .22,

                transform:
                    "rotateY(-20deg) skewY(-1deg) scaleX(.995)",

                opacity: 1
            },

            {
                offset: .56,

                transform:
                    "rotateY(-82deg) skewY(-2.6deg) scaleX(.94)",

                opacity: .97
            },

            {
                offset: .82,

                transform:
                    "rotateY(-145deg) skewY(-1deg) scaleX(.975)",

                opacity: .76
            },

            {
                transform:
                    "rotateY(-178deg) skewY(0deg) scaleX(1)",

                opacity: .05
            }

        ];

    }

    else {

        mobileTurnCard.innerHTML =
            mobilePage.innerHTML;


        mobilePage.innerHTML =
            oldHTML;


        frames = [

            {
                transform:
                    "rotateY(-178deg) skewY(0deg) scaleX(1)",

                opacity: .05
            },

            {
                offset: .24,

                transform:
                    "rotateY(-142deg) skewY(1deg) scaleX(.975)",

                opacity: .76
            },

            {
                offset: .55,

                transform:
                    "rotateY(-83deg) skewY(2.7deg) scaleX(.94)",

                opacity: .97
            },

            {
                offset: .82,

                transform:
                    "rotateY(-18deg) skewY(1deg) scaleX(.995)",

                opacity: 1
            },

            {
                transform:
                    "rotateY(0deg) skewY(0deg) scaleX(1)",

                opacity: 1
            }

        ];

    }


    const animation =
        mobileTurnCard.animate(
            frames,

            {
                duration: 1150,

                easing:
                    "cubic-bezier(.18,.70,.18,1)",

                fill: "forwards"
            }
        );


    await animation.finished;


    currentSpread =
        nextIndex;


    mobileTurnCard.classList.remove(
        "active"
    );


    animation.cancel();


    renderMobile();


    turning = false;

}


/* =========================================================
   CONTROLS
========================================================= */

function updateControls() {

    const STORY_SPREADS =
        17;


    if (
        currentSpread <
        STORY_SPREADS
    ) {

        counter.textContent =
            `${currentSpread + 1} / ${STORY_SPREADS}`;

    }

    else if (
        currentSpread ===
        STORY_SPREADS
    ) {

        counter.textContent =
            "Після читання";

    }

    else {

        counter.textContent =
            "Перевірка уважності";

    }


    [
        document.getElementById(
            "desktopPrev"
        ),

        document.getElementById(
            "mobilePrev"
        )

    ].forEach(
        button => {

            button.disabled =
                currentSpread === 0;

        }
    );


    [
        document.getElementById(
            "desktopNext"
        ),

        document.getElementById(
            "mobileNext"
        )

    ].forEach(
        button => {

            button.disabled =
                currentSpread ===
                spreads.length - 1;

        }
    );

}


/* =========================================================
   PAGE THICKNESS
========================================================= */

function updateThickness() {

    const max =
        spreads.length - 1;


    const progress =
        currentSpread / max;


    desktopBook.style
        .setProperty(
            "--left-stack",
            `${
                5
                +
                progress * 22
            }px`
        );


    desktopBook.style
        .setProperty(
            "--right-stack",
            `${
                27
                -
                progress * 22
            }px`
        );

}


/* =========================================================
   INTERACTIONS
========================================================= */

function wireInteractions(
    root
) {

    root.querySelectorAll(
        ".task-toggle"
    )
    .forEach(
        toggle => {

            toggle.addEventListener(
                "click",
                () => {

                    const card =
                        toggle.closest(
                            ".task-card"
                        );


                    root.querySelectorAll(
                        ".task-card.open"
                    )
                    .forEach(
                        openCard => {

                            if (
                                openCard !==
                                card
                            ) {

                                openCard
                                    .classList
                                    .remove(
                                        "open"
                                    );

                            }

                        }
                    );


                    card.classList
                        .toggle(
                            "open"
                        );

                }
            );

        }
    );


    root.querySelectorAll(
        ".quiz-toggle"
    )
    .forEach(
        toggle => {

            toggle.addEventListener(
                "click",
                () => {

                    const card =
                        toggle.closest(
                            ".quiz-card"
                        );


                    root.querySelectorAll(
                        ".quiz-card.open"
                    )
                    .forEach(
                        openCard => {

                            if (
                                openCard !==
                                card
                            ) {

                                openCard
                                    .classList
                                    .remove(
                                        "open"
                                    );

                            }

                        }
                    );


                    card.classList
                        .toggle(
                            "open"
                        );

                }
            );

        }
    );


    root.querySelectorAll(
        ".answer"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                event => {

                    event.stopPropagation();


                    const card =
                        button.closest(
                            ".quiz-card"
                        );


                    if (
                        card.dataset.done ===
                        "true"
                    ) {
                        return;
                    }


                    const correct =
                        card.dataset.correct;

                    const selected =
                        button.dataset.answer;


                    if (
                        selected ===
                        correct
                    ) {

                        button.classList
                            .add(
                                "correct"
                            );

                        card.dataset.done =
                            "true";

                        celebrateJabuti();

                    }

                    else {

                        button.classList
                            .add(
                                "wrong"
                            );


                        setTimeout(
                            () => {

                                button.classList
                                    .remove(
                                        "wrong"
                                    );

                            },
                            650
                        );

                    }

                }
            );

        }
    );


    const memoryButton =
        root.querySelector(
            "[data-memory]"
        );


    if (
        memoryButton
    ) {

        memoryButton.addEventListener(
            "click",
            () => {

                const answer =
                    root.querySelector(
                        ".memory-answer"
                    );


                answer.classList
                    .add(
                        "visible"
                    );


                celebrateJabuti();

            }
        );

    }

}


/* =========================================================
   JABUTI REACTION
========================================================= */

function celebrateJabuti() {

    const root =
        mobileMode
        ? mobilePage
        : leftPage;


    const jabuti =
        root.querySelector(
            ".quiz-jabuti"
        );


    if (
        !jabuti
    ) {
        return;
    }


    jabuti.classList
        .remove(
            "celebrate"
        );


    void jabuti.offsetWidth;


    jabuti.classList
        .add(
            "celebrate"
        );

}


/* =========================================================
   OPEN
========================================================= */

document
    .getElementById(
        "openBookButton"
    )
    .addEventListener(
        "click",
        () => {

            coverFace.classList
                .add(
                    "opening"
                );


            setTimeout(
                () => {

                    coverScreen.style
                        .display =
                        "none";


                    readerScreen.classList
                        .add(
                            "visible"
                        );


                    renderCurrent();

                },
                800
            );

        }
    );


/* =========================================================
   CORNERS
========================================================= */

document
    .getElementById(
        "desktopNext"
    )
    .addEventListener(
        "click",
        desktopNextSpread
    );


document
    .getElementById(
        "desktopPrev"
    )
    .addEventListener(
        "click",
        desktopPreviousSpread
    );


document
    .getElementById(
        "mobileNext"
    )
    .addEventListener(
        "click",
        () =>
            mobileTurn(1)
    );


document
    .getElementById(
        "mobilePrev"
    )
    .addEventListener(
        "click",
        () =>
            mobileTurn(-1)
    );


/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener(
    "keydown",
    event => {

        if (
            !readerScreen
                .classList
                .contains(
                    "visible"
                )
        ) {
            return;
        }


        if (
            event.key ===
            "ArrowRight"
        ) {

            if (
                mobileMode
            ) {
                mobileTurn(1);
            }
            else {
                desktopNextSpread();
            }

        }


        if (
            event.key ===
            "ArrowLeft"
        ) {

            if (
                mobileMode
            ) {
                mobileTurn(-1);
            }
            else {
                desktopPreviousSpread();
            }

        }

    }
);


/* =========================================================
   HOME
========================================================= */

document
    .getElementById(
        "homeButton"
    )
    .addEventListener(
        "click",
        () => {

            readerScreen
                .classList
                .remove(
                    "visible"
                );


            coverScreen.style
                .display =
                "flex";


            coverFace.classList
                .remove(
                    "opening"
                );


            currentSpread = 0;

            turning = false;

        }
    );


/* =========================================================
   FULLSCREEN
========================================================= */

document
    .getElementById(
        "fullscreenButton"
    )
    .addEventListener(
        "click",
        async () => {

            try {

                if (
                    !document
                        .fullscreenElement
                ) {

                    await document
                        .documentElement
                        .requestFullscreen();

                }

                else {

                    await document
                        .exitFullscreen();

                }

            }

            catch (
                error
            ) {

                console.log(
                    error
                );

            }

        }
    );


/* =========================================================
   RESIZE / ROTATION
========================================================= */

let resizeTimer;


window.addEventListener(
    "resize",
    () => {

        clearTimeout(
            resizeTimer
        );


        resizeTimer =
            setTimeout(
                () => {

                    if (
                        readerScreen
                            .classList
                            .contains(
                                "visible"
                            )
                    ) {

                        renderCurrent();

                    }

                },
                100
            );

    }
);


/* initial */
fitBookToViewport();

</script>
